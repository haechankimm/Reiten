# 보안 패치 자동화(2026-10-02) — 의존성에 보안 업데이트가 나오면 GitHub이 자동으로 PR을 만든다.
# 그 PR에서도 기존 Test 워크플로(.github/workflows/test.yml)가 자동으로 돌아 테스트 통과 여부를 보여준다 —
# 초록불이면 머지만 하면 되고, 빨간불이면 Claude에게 "이 Dependabot PR 고쳐줘"라고 하면 된다.
# 저장소 Settings → Code security에서 "Dependabot security updates"도 켜두면 취약점 알림 즉시 PR이 온다.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/server"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Seoul"
    open-pull-requests-limit: 5
    groups:
      # 자잘한 패치·마이너 업데이트는 한 PR로 묶어 알림 피로를 줄인다(메이저 업데이트는 따로)
      minor-and-patch:
        update-types: ["minor", "patch"]
    labels: ["dependencies"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    labels: ["dependencies"]
