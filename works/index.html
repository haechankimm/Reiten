<!doctype html>
<html lang="ko" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>REITEN WORKS</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/assets/img/logo-mark.png">
<link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>

<main id="main">
  <section class="sec sec--tight">
    <div class="wrap">
      <div style="display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap">
        <h1 class="h-xl">REITEN WORKS</h1>
        <div id="works-topbar" hidden style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">
          <div class="chips" id="admin-lang-switch">
            <button class="chip" type="button" data-admin-lang="ko" aria-pressed="true">한국어</button>
            <button class="chip" type="button" data-admin-lang="de" aria-pressed="false">Deutsch</button>
          </div>
          <button class="btn" type="button" id="logout" data-i18n="로그아웃">로그아웃</button>
        </div>
      </div>
      <p class="lede" id="works-greeting" style="margin-top:10px"></p>
      <hr class="rule" style="margin:26px 0 34px">

      <div class="notice" id="no-server-notice" hidden>
        <span data-i18n="서버(server/)가 꺼져 있어 로그인할 수 없습니다.">서버(server/)가 꺼져 있어 로그인할 수 없습니다.</span>
      </div>

      <!-- ============ 로그인 ============ -->
      <div id="auth-view" hidden>
        <form id="login-form" novalidate style="max-width:44ch">
          <div class="field">
            <label for="li-email" data-i18n="이메일">이메일</label>
            <input id="li-email" type="email" autocomplete="email" required>
          </div>
          <div class="field">
            <label for="li-pw" data-i18n="비밀번호">비밀번호</label>
            <input id="li-pw" type="password" autocomplete="current-password" required>
            <p class="err" id="li-err"></p>
          </div>
          <button class="btn btn--full" type="submit" id="li-submit" data-i18n="로그인">로그인</button>
          <p class="small" style="margin-top:10px">
            <a href="#" id="forgot-pw-link" data-i18n="비밀번호를 잊으셨나요?">비밀번호를 잊으셨나요?</a>
          </p>
        </form>

        <form id="reset-request-form" novalidate style="margin-top:24px;max-width:44ch" hidden>
          <p class="small" data-i18n="가입하신 이메일로 비밀번호 재설정 링크를 보내드립니다.">가입하신 이메일로 비밀번호 재설정 링크를 보내드립니다.</p>
          <div class="field">
            <label for="rq-email" data-i18n="이메일">이메일</label>
            <input id="rq-email" type="email" autocomplete="email" required>
            <p class="err" id="rq-err"></p>
          </div>
          <button class="btn btn--full" type="submit" id="rq-submit" data-i18n="재설정 링크 보내기">재설정 링크 보내기</button>
          <button class="btn btn--ghost btn--full" type="button" id="rq-cancel" style="margin-top:8px" data-i18n="취소">취소</button>
        </form>

        <form id="reset-confirm-form" novalidate style="margin-top:24px;max-width:44ch" hidden>
          <p class="small" data-i18n="새 비밀번호를 입력해 주세요.">새 비밀번호를 입력해 주세요.</p>
          <div class="field">
            <label for="rc-pw" data-i18n="새 비밀번호">새 비밀번호</label>
            <input id="rc-pw" type="password" autocomplete="new-password" minlength="6" required>
          </div>
          <div class="field">
            <label for="rc-pw2" data-i18n="새 비밀번호 확인">새 비밀번호 확인</label>
            <input id="rc-pw2" type="password" autocomplete="new-password" minlength="6" required>
            <p class="err" id="rc-err"></p>
          </div>
          <button class="btn btn--full" type="submit" id="rc-submit" data-i18n="비밀번호 변경">비밀번호 변경</button>
        </form>
      </div>

      <!-- ============ 관리자 패널 ============ -->
      <section id="admin-panel" hidden>
        <div class="chips" id="admin-tabs">
          <button class="chip" type="button" data-tab="orders" aria-pressed="true" data-i18n="전체 주문">전체 주문</button>
          <button class="chip" type="button" data-tab="returns" aria-pressed="false" data-i18n="반품·교환 신청">반품·교환 신청</button>
          <button class="chip" type="button" data-tab="inventory" aria-pressed="false" data-i18n="재고">재고</button>
          <button class="chip" type="button" data-tab="qna" aria-pressed="false" data-i18n="Q&A">Q&amp;A</button>
          <button class="chip" type="button" data-tab="products" aria-pressed="false" data-i18n="상품">상품</button>
          <button class="chip" type="button" data-tab="reviews" aria-pressed="false" data-i18n="리뷰">리뷰</button>
          <button class="chip" type="button" data-tab="lookbook" aria-pressed="false" data-i18n="룩북">룩북</button>
        </div>

        <div id="admin-orders" style="display:grid;gap:12px;max-width:80ch;margin-top:22px"></div>
        <div id="admin-returns" style="display:grid;gap:12px;max-width:80ch;margin-top:22px" hidden></div>
        <div id="admin-inventory" style="display:grid;gap:10px;max-width:60ch;margin-top:22px" hidden></div>
        <div id="admin-qna" style="display:grid;gap:12px;max-width:80ch;margin-top:22px" hidden></div>
        <div id="admin-reviews" style="display:grid;gap:12px;max-width:80ch;margin-top:22px" hidden></div>

        <div id="admin-products" style="display:grid;gap:24px;max-width:70ch;margin-top:22px" hidden>
          <div class="panel">
            <b id="product-form-title" data-i18n="새 상품 추가">새 상품 추가</b>
            <form id="product-form" novalidate style="margin-top:14px;display:grid;gap:12px">
              <div class="field">
                <label for="pf-id" data-i18n="상품 ID (영문 소문자·숫자·하이픈)">상품 ID (영문 소문자·숫자·하이픈)</label>
                <input id="pf-id" required pattern="[a-z0-9-]{2,60}">
              </div>
              <div class="field">
                <label for="pf-name" data-i18n="영문명">영문명</label>
                <input id="pf-name" required>
              </div>
              <div class="field">
                <label for="pf-nameko" data-i18n="한글명">한글명</label>
                <input id="pf-nameko" required>
              </div>
              <div class="field">
                <label for="pf-type" data-i18n="타입">타입</label>
                <select id="pf-type" required>
                  <option value="hoodie">hoodie (후드티)</option>
                  <option value="zip">zip (집업)</option>
                  <option value="crop">crop (크롭)</option>
                  <option value="tshirt">tshirt (티셔츠)</option>
                </select>
              </div>
              <div class="field">
                <label for="pf-category" data-i18n="카테고리">카테고리</label>
                <select id="pf-category" required></select>
                <input id="pf-category-custom" style="margin-top:8px" hidden placeholder="새 카테고리 이름" data-i18n-attr="placeholder:새 카테고리 이름">
              </div>
              <div class="field">
                <label for="pf-price" data-i18n="가격">가격</label>
                <input id="pf-price" type="number" min="0" required>
              </div>
              <div class="field">
                <label for="pf-badge" data-i18n="배지 (선택)">배지 (선택)</label>
                <input id="pf-badge">
              </div>
              <div class="field">
                <label for="pf-short" data-i18n="한 줄 설명">한 줄 설명</label>
                <input id="pf-short">
              </div>
              <div class="field">
                <label for="pf-desc" data-i18n="상세 설명">상세 설명</label>
                <textarea id="pf-desc"></textarea>
              </div>
              <div class="field">
                <label for="pf-details" data-i18n="상세 정보 (한 줄에 하나씩)">상세 정보 (한 줄에 하나씩)</label>
                <textarea id="pf-details"></textarea>
              </div>
              <div class="field">
                <label data-i18n="컬러">컬러</label>
                <div class="chips" id="pf-colors"></div>
              </div>
              <div class="field">
                <label data-i18n="사이즈 재고 (체크 해제 시 품절로 표시)">사이즈 재고 (체크 해제 시 품절로 표시)</label>
                <div style="display:flex;gap:16px;flex-wrap:wrap;margin-top:8px">
                  <label class="checkbox"><input type="checkbox" class="pf-size" value="XS" checked><span>XS</span></label>
                  <label class="checkbox"><input type="checkbox" class="pf-size" value="S" checked><span>S</span></label>
                  <label class="checkbox"><input type="checkbox" class="pf-size" value="M" checked><span>M</span></label>
                  <label class="checkbox"><input type="checkbox" class="pf-size" value="L" checked><span>L</span></label>
                  <label class="checkbox"><input type="checkbox" class="pf-size" value="XL" checked><span>XL</span></label>
                </div>
              </div>
              <div class="field">
                <label for="pf-sizetable" data-i18n="사이즈표">사이즈표</label>
                <select id="pf-sizetable">
                  <option value="hoodie">hoodie</option>
                  <option value="crop">crop</option>
                  <option value="tshirt">tshirt</option>
                </select>
              </div>
              <div class="field">
                <label class="checkbox"><input type="checkbox" id="pf-charmready"><span data-i18n="지퍼 참 커스텀 가능">지퍼 참 커스텀 가능</span></label>
              </div>
              <div class="field">
                <label class="checkbox"><input type="checkbox" id="pf-active" checked><span data-i18n="공개 (체크 해제 시 매장에서 숨김)">공개 (체크 해제 시 매장에서 숨김)</span></label>
              </div>
              <div class="field">
                <label data-i18n="사진 (최대 4장)">사진 (최대 4장)</label>
                <div id="pf-photos" style="display:grid;grid-template-columns:repeat(4,1fr);gap:12px"></div>
              </div>
              <div style="display:flex;gap:8px">
                <button class="btn" type="submit" id="pf-submit" data-i18n="상품 저장">상품 저장</button>
                <button class="btn btn--ghost" type="button" id="pf-cancel" hidden data-i18n="취소">취소</button>
              </div>
            </form>
          </div>

          <div id="products-list" style="display:grid;gap:12px"></div>
        </div>

        <div id="admin-lookbook" style="display:grid;gap:24px;max-width:70ch;margin-top:22px" hidden>
          <div class="panel">
            <b id="lookbook-form-title" data-i18n="새 룩북 칸 추가">새 룩북 칸 추가</b>
            <form id="lookbook-form" novalidate style="margin-top:14px;display:grid;gap:12px">
              <div class="field">
                <label for="lf-label" data-i18n="라벨">라벨</label>
                <input id="lf-label" required>
              </div>
              <div class="field">
                <label for="lf-note" data-i18n="설명 (선택)">설명 (선택)</label>
                <input id="lf-note">
              </div>
              <div class="field">
                <label for="lf-span" data-i18n="가로 크기">가로 크기</label>
                <select id="lf-span">
                  <option value="w4">w4 (1/3)</option>
                  <option value="w6">w6 (1/2)</option>
                  <option value="w8">w8 (2/3)</option>
                  <option value="w12" data-i18n="w12 (전체)">w12 (전체)</option>
                </select>
              </div>
              <div class="field">
                <label for="lf-ratio" data-i18n="가로세로 비율">가로세로 비율</label>
                <select id="lf-ratio-select">
                  <option value="1/1">1 / 1 (정사각형)</option>
                  <option value="4/5">4 / 5 (세로)</option>
                  <option value="3/4">3 / 4 (세로)</option>
                  <option value="2/3">2 / 3 (세로, 긴 편)</option>
                  <option value="16/10" selected>16 / 10 (기본)</option>
                  <option value="16/9">16 / 9 (와이드)</option>
                  <option value="__custom__" data-i18n="직접 입력">직접 입력</option>
                </select>
                <input id="lf-ratio" style="margin-top:8px" hidden placeholder="16/10" required>
              </div>
              <div class="field">
                <label class="checkbox"><input type="checkbox" id="lf-active" checked><span data-i18n="공개 (체크 해제 시 숨김)">공개 (체크 해제 시 숨김)</span></label>
              </div>
              <div class="field">
                <label data-i18n="사진">사진</label>
                <div id="lf-photo" style="max-width:220px"></div>
              </div>
              <div class="field">
                <label data-i18n="미리보기">미리보기</label>
                <div class="look" style="max-width:360px;margin-top:4px">
                  <figure id="lf-preview-figure" class="w6">
                    <div id="lf-preview-media"></div>
                    <figcaption><span id="lf-preview-label"></span><span id="lf-preview-note"></span></figcaption>
                  </figure>
                </div>
              </div>
              <div style="display:flex;gap:8px">
                <button class="btn" type="submit" id="lf-submit" data-i18n="저장">저장</button>
                <button class="btn btn--ghost" type="button" id="lf-cancel" hidden data-i18n="취소">취소</button>
              </div>
            </form>
          </div>

          <div id="lookbook-list" style="display:grid;gap:12px"></div>
        </div>
      </section>
    </div>
  </section>
</main>

<script src="/assets/js/data.js"></script>
<script src="/assets/js/i18n.js"></script>
<script src="/assets/js/auth-client.js"></script>
<script>
  /* account.html의 관리자 패널 로직을 그대로 옮겨왔다 — 소비자용 app.js(헤더/테마/배너 애니메이션 등)는
     Works에서 쓸 일이 없어 아예 불러오지 않고, 거기서 쓰던 esc/money/toast만 최소한으로 다시 정의한다. */
  const el = (id) => document.getElementById(id);
  const esc = (s) =>
    String(s ?? "").replace(/[&<>"']/g, (c) =>
      ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])
    );
  const money = (n) => Number(n || 0).toLocaleString("ko-KR") + "원";

  let toastTimer;
  function toast(msg) {
    let t = document.querySelector(".toast");
    if (!t) {
      t = document.createElement("div");
      t.className = "toast";
      t.setAttribute("role", "status");
      document.body.appendChild(t);
    }
    t.textContent = msg;
    requestAnimationFrame(() => t.classList.add("on"));
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove("on"), 2600);
  }

  applyI18n();

  function authErrorMessage(error) {
    const msg = String((error && error.message) || "");
    if (/password.*(least|weak)/i.test(msg)) return t("비밀번호는 6자 이상이어야 합니다.");
    if (/invalid.*email/i.test(msg)) return t("이메일 형식이 올바르지 않습니다.");
    if (/rate limit/i.test(msg)) return t("요청이 너무 많습니다. 잠시 후 다시 시도해주세요.");
    return msg;
  }

  const ORDER_STATUSES = ["입금대기", "입금확인", "배송중", "완료", "취소"];
  const RETURN_STATUSES = ["접수", "처리중", "완료", "반려"];

  function fmtDate(iso) {
    return new Date(iso).toLocaleDateString(getLang() === "de" ? "de-DE" : "ko-KR");
  }

  /* ---------- 관리자 패널 ---------- */
  function switchTabs(tabsId, panelIds) {
    const tabs = el(tabsId);
    tabs.querySelectorAll(".chip").forEach((b) =>
      b.addEventListener("click", () => {
        tabs.querySelectorAll(".chip").forEach((x) => x.setAttribute("aria-pressed", x === b));
        Object.keys(panelIds).forEach((key) => (el(panelIds[key]).hidden = key !== b.dataset.tab));
      })
    );
  }
  switchTabs("admin-tabs", { orders: "admin-orders", returns: "admin-returns", inventory: "admin-inventory", qna: "admin-qna", products: "admin-products", reviews: "admin-reviews", lookbook: "admin-lookbook" });

  el("admin-lang-switch").querySelectorAll("[data-admin-lang]").forEach((b) => {
    b.setAttribute("aria-pressed", b.dataset.adminLang === getLang() ? "true" : "false");
    b.addEventListener("click", () => setLang(b.dataset.adminLang));
  });

  async function adminFetch(path, opts) {
    const token = await getAccessToken();
    if (!token) {
      toast(t("로그인이 만료되었습니다. 다시 로그인해 주세요."));
      return null;
    }
    const res = await fetch(path, {
      ...opts,
      headers: { "Content-Type": "application/json", Authorization: "Bearer " + token, ...(opts && opts.headers) },
    });
    if (!res.ok) {
      if (res.status === 401) {
        toast(t("로그인이 만료되었습니다. 다시 로그인해 주세요."));
      } else {
        let message = "";
        try { message = (await res.json()).error || ""; } catch (e) {}
        toast(message || t("요청이 실패했습니다") + ` (${res.status})`);
      }
      return null;
    }
    return res.json();
  }

  function loadMoreHTML(hasMore, id) {
    if (!hasMore) return "";
    return `<div style="text-align:center;margin-top:8px">
      <button type="button" id="${id}" class="btn btn--sm btn--ghost">${esc(t("더 보기"))}</button>
    </div>`;
  }

  const ordersState = { page: 0, pageSize: 20, total: 0, items: [] };

  function orderCardHTML(o) {
    return `
      <div class="panel" data-no="${esc(o.no)}">
        <div style="display:flex;justify-content:space-between;gap:12px;align-items:baseline">
          <b class="tnum">${esc(o.no)}</b>
          <span class="small tnum">${fmtDate(o.at)}</span>
        </div>
        <p class="small" style="margin-top:6px">${esc(o.customer.name)} · ${esc(o.customer.tel)}</p>
        <p class="small" style="margin-top:4px">${o.items.map((it) => `${esc(it.name)} × ${it.qty}`).join(", ")}</p>
        <div style="display:flex;justify-content:space-between;gap:12px;align-items:center;margin-top:10px">
          <select class="admin-order-status">${ORDER_STATUSES.map((s) => `<option value="${s}" ${s === o.status ? "selected" : ""}>${esc(t(s))}</option>`).join("")}</select>
          <b class="tnum">${money(o.total)}</b>
        </div>
        <div style="display:flex;gap:8px;align-items:center;margin-top:10px;flex-wrap:wrap">
          <select class="admin-order-courier" style="flex:1;min-width:110px">
            <option value="" ${!o.courier ? "selected" : ""}>${esc(t("택배사 선택"))}</option>
            ${COURIERS.map((c) => `<option value="${c.key}" ${c.key === o.courier ? "selected" : ""}>${esc(c.label)}</option>`).join("")}
          </select>
          <input class="admin-order-tracking" placeholder="${esc(t("운송장번호"))}" value="${esc(o.trackingNo || "")}" style="flex:1;min-width:130px">
          <button type="button" class="btn btn--sm admin-order-tracking-save" data-i18n="저장">저장</button>
        </div>
      </div>`;
  }

  function renderAdminOrders() {
    const hasMore = ordersState.items.length < ordersState.total;
    el("admin-orders").innerHTML = ordersState.items.map(orderCardHTML).join("") + loadMoreHTML(hasMore, "admin-orders-more");

    el("admin-orders").querySelectorAll(".admin-order-status").forEach((sel) =>
      sel.addEventListener("change", async () => {
        const no = sel.closest("[data-no]").dataset.no;
        await adminFetch(`/api/admin/orders/${encodeURIComponent(no)}`, {
          method: "PATCH",
          body: JSON.stringify({ status: sel.value }),
        });
        toast(t("상태를 저장했습니다"));
      })
    );

    el("admin-orders").querySelectorAll(".admin-order-tracking-save").forEach((btn) =>
      btn.addEventListener("click", async () => {
        const card = btn.closest("[data-no]");
        const no = card.dataset.no;
        const courier = card.querySelector(".admin-order-courier").value;
        const trackingNo = card.querySelector(".admin-order-tracking").value.trim();
        await adminFetch(`/api/admin/orders/${encodeURIComponent(no)}`, {
          method: "PATCH",
          body: JSON.stringify({ courier, trackingNo }),
        });
        toast(t("배송정보를 저장했습니다"));
      })
    );

    el("admin-orders-more")?.addEventListener("click", () => paintAdminOrders(true));
  }

  async function paintAdminOrders(loadMore = false) {
    ordersState.page = loadMore ? ordersState.page + 1 : 1;
    const result = await adminFetch(`/api/admin/orders?page=${ordersState.page}&pageSize=${ordersState.pageSize}`);

  let pfKnownCategories = [...CATEGORY_BASE];

  function renderPfCategory(selected) {
    const known = selected && !pfKnownCategories.includes(selected) ? [...pfKnownCategories, selected] : pfKnownCategories;
    el("pf-category").innerHTML =
      known.map((c) => `<option value="${esc(c)}">${esc(t(c))}</option>`).join("") +
      `<option value="__custom__">${esc(t("직접 입력 (새 카테고리)"))}</option>`;

    el("pf-category-custom").hidden = true;
    el("pf-category-custom").value = "";

  el("pf-category").addEventListener("change", () => {
    const isCustom = el("pf-category").value === "__custom__";
    el("pf-category-custom").hidden = !isCustom;
    if (isCustom) el("pf-category-custom").focus();
  });

  function renderPfColors() {
    el("pf-colors").innerHTML = Object.values(COLORS).map((c) => `

        renderPfColors();
      })

  const PF_UPLOAD_ICON = `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h3l2-2h6l2 2h3a1 1 0 0 1 1 1v11a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V8a1 1 0 0 1 1-1Z"/><circle cx="12" cy="13" r="3.5"/></svg>`;

  function renderPfPhotos() {
    el("pf-photos").innerHTML = pfImages.map((url, i) => {
      const photoLabel = t("상품사진 {n}", { n: i + 1 });
      return `
      <div>
        <div class="small" style="margin-bottom:6px;font-weight:600">${esc(photoLabel)}</div>
        ${url
          ? `<img src="${esc(url)}" style="width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;border:1px solid var(--line)">`
          : `<div style="width:100%;aspect-ratio:1;border:1px dashed var(--line);border-radius:8px;display:flex;align-items:center;justify-content:center" class="small">${esc(t("사진 없음"))}</div>`}
        <div style="display:flex;flex-direction:column;gap:6px;margin-top:8px">
          <label class="upload-btn" style="cursor:pointer;justify-content:center;width:100%">
            ${PF_UPLOAD_ICON}
            <span>${esc(url ? t("사진 변경") : t("사진 선택"))}</span>
            <input type="file" accept="image/*" class="upload-input pf-photo-input" data-i="${i}">
          </label>
          ${url ? `<button type="button" class="btn btn--sm btn--ghost pf-photo-remove" data-i="${i}">${esc(t("제거"))}</button>` : ""}
        </div>
      </div>`;
    }).join("");
    el("pf-photos").querySelectorAll(".pf-photo-input").forEach((inp) => inp.addEventListener("change", () => onPfPhotoChange(inp)));
    el("pf-photos").querySelectorAll(".pf-photo-remove").forEach((btn) =>
      btn.addEventListener("click", () => { pfImages[Number(btn.dataset.i)] = null; renderPfPhotos(); })
    );
  }

  async function onPfPhotoChange(input) {
    const file = input.files[0];
    if (!file) return;
    const i = Number(input.dataset.i);
    const token = await getAccessToken();
    const fd = new FormData();
    fd.append("photo", file);
    input.disabled = true;
    try {
      const res = await fetch("/api/admin/products/photo", {
        method: "POST",
        headers: { Authorization: "Bearer " + token },
        body: fd,
      });
      if (!res.ok) throw new Error("failed");
      const { url } = await res.json();
      pfImages[i] = url;
      renderPfPhotos();
    } catch (e) {
      toast(t("사진 업로드에 실패했습니다"));
    }
  }

  function resetProductForm() {
    pfEditingId = null;
    pfImages = [null, null, null, null];
    pfSelectedColors = [];
    el("product-form-title").textContent = t("새 상품 추가");
    el("pf-id").value = "";
    el("pf-id").disabled = false;
    el("pf-name").value = "";
    el("pf-nameko").value = "";
    el("pf-type").value = "hoodie";
    renderPfCategory();
    el("pf-price").value = "";
    el("pf-badge").value = "";
    el("pf-short").value = "";
    el("pf-desc").value = "";
    el("pf-details").value = "";
    document.querySelectorAll(".pf-size").forEach((cb) => (cb.checked = true));
    el("pf-sizetable").value = "hoodie";
    el("pf-charmready").checked = false;
    el("pf-active").checked = true;
    el("pf-cancel").hidden = true;
    renderPfColors();
    renderPfPhotos();
  }

  function fillProductForm(p) {
    pfEditingId = p.id;
    pfImages = [0, 1, 2, 3].map((i) => p.images[i] || null);
    pfSelectedColors = [...(p.colors || [])];
    el("product-form-title").textContent = t("상품 수정") + " — " + p.id;
    el("pf-id").value = p.id;
    el("pf-id").disabled = true;
    el("pf-name").value = p.name || "";
    el("pf-nameko").value = p.nameKo || "";
    el("pf-type").value = p.type || "hoodie";
    renderPfCategory(p.category || "");
    el("pf-price").value = p.price;
    el("pf-badge").value = p.badge || "";
    el("pf-short").value = p.short || "";
    el("pf-desc").value = p.desc || "";
    el("pf-details").value = (p.details || []).join("\n");
    const soldOut = p.soldOut || [];
    document.querySelectorAll(".pf-size").forEach((cb) => (cb.checked = !soldOut.includes(cb.value)));
    el("pf-sizetable").value = p.sizeTable || "hoodie";
    el("pf-charmready").checked = !!p.charmReady;
    el("pf-active").checked = p.active !== false;
    el("pf-cancel").hidden = false;
    renderPfColors();
    renderPfPhotos();
    el("product-form").scrollIntoView({ behavior: "smooth", block: "start" });
  }

  el("product-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const id = el("pf-id").value.trim();
    if (!pfEditingId && !/^[a-z0-9-]{2,60}$/.test(id)) {
      toast(t("상품 ID는 영문 소문자·숫자·하이픈만 2~60자로 입력해 주세요."));
      return;
    }
    const category = el("pf-category").value === "__custom__" ? el("pf-category-custom").value.trim() : el("pf-category").value;
    if (!category) {
      toast(t("카테고리를 입력해 주세요."));
      return;
    }

    const body = {
      name: el("pf-name").value.trim(),
      nameKo: el("pf-nameko").value.trim(),
      type: el("pf-type").value,
      category,
      price: Number(el("pf-price").value),
      badge: el("pf-badge").value.trim(),
      short: el("pf-short").value.trim(),
      desc: el("pf-desc").value.trim(),
      details: el("pf-details").value.split("\n").map((s) => s.trim()).filter(Boolean),
      colors: pfSelectedColors,
      sizes: PF_SIZE_OPTIONS,
      soldOut: [...document.querySelectorAll(".pf-size")].filter((cb) => !cb.checked).map((cb) => cb.value),
      sizeTable: el("pf-sizetable").value,
      charmReady: el("pf-charmready").checked,
      active: el("pf-active").checked,
      images: pfImages,
    };

    const btn = el("pf-submit");
    btn.disabled = true;
    try {
      const result = pfEditingId
        ? await adminFetch(`/api/admin/products/${encodeURIComponent(pfEditingId)}`, { method: "PATCH", body: JSON.stringify(body) })

  function renderLfRatio(value) {
    const v = value || "16/10";
    if (LF_RATIO_PRESETS.includes(v)) {
      el("lf-ratio-select").value = v;
      el("lf-ratio").hidden = true;
      el("lf-ratio").value = "";
    } else {
      el("lf-ratio-select").value = "__custom__";
      el("lf-ratio").hidden = false;
      el("lf-ratio").value = v;
    }

    return el("lf-ratio-select").value === "__custom__" ? el("lf-ratio").value.trim() : el("lf-ratio-select").value;
  }
  el("lf-ratio-select").addEventListener("change", () => {
    const isCustom = el("lf-ratio-select").value === "__custom__";

    if (isCustom) el("lf-ratio").focus();

    el("lf-photo").innerHTML = `
      ${lfSrc
        ? `<img src="${esc(lfSrc)}" style="width:100%;aspect-ratio:4/5;object-fit:cover;border-radius:8px;border:1px solid var(--line)">`
        : `<div style="width:100%;aspect-ratio:4/5;border:1px dashed var(--line);border-radius:8px;display:flex;align-items:center;justify-content:center" class="small">${esc(t("사진 없음"))}</div>`}
      <div style="display:flex;flex-direction:column;gap:6px;margin-top:8px">
        <label class="upload-btn" style="cursor:pointer;justify-content:center;width:100%">
          ${PF_UPLOAD_ICON}
          <span>${esc(lfSrc ? t("사진 변경") : t("사진 선택"))}</span>
          <input type="file" accept="image/*" class="upload-input" id="lf-photo-input">
        </label>
        ${lfSrc ? `<button type="button" class="btn btn--sm btn--ghost" id="lf-photo-remove">${esc(t("제거"))}</button>` : ""}
      </div>
    `;
    el("lf-photo-input").addEventListener("change", onLfPhotoChange);
    el("lf-photo-remove")?.addEventListener("click", () => { lfSrc = null; renderLfPhoto(); renderLfPreview(); });
    renderLfPreview();
  }

  async function onLfPhotoChange(e) {
    const file = e.target.files[0];
    if (!file) return;
    const token = await getAccessToken();
    const fd = new FormData();
    fd.append("photo", file);
    e.target.disabled = true;
    try {
      const res = await fetch("/api/admin/lookbook/photo", {
        method: "POST",
        headers: { Authorization: "Bearer " + token },
        body: fd,
      });
      if (!res.ok) throw new Error("failed");
      const { url } = await res.json();
      lfSrc = url;
      renderLfPhoto();
    } catch (err) {
      toast(t("사진 업로드에 실패했습니다"));
    }
  }

  function resetLookbookForm() {
    lfEditingId = null;
    lfSrc = null;
    el("lookbook-form-title").textContent = t("새 룩북 칸 추가");
    el("lf-label").value = "";
    el("lf-note").value = "";
    el("lf-span").value = "w6";
    renderLfRatio("16/10");
    el("lf-active").checked = true;
    el("lf-cancel").hidden = true;
    renderLfPhoto();
  }

  function fillLookbookForm(item) {
    lfEditingId = item.id;
    lfSrc = item.src || null;
    el("lookbook-form-title").textContent = t("룩북 칸 수정");
    el("lf-label").value = item.label || "";
    el("lf-note").value = item.note || "";
    el("lf-span").value = item.span || "w6";
    renderLfRatio(item.ratio || "16/10");
    el("lf-active").checked = item.active !== false;
    el("lf-cancel").hidden = false;
    renderLfPhoto();
    el("lookbook-form").scrollIntoView({ behavior: "smooth", block: "start" });
  }

  el("lookbook-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const body = {
      label: el("lf-label").value.trim(),
      note: el("lf-note").value.trim(),
      span: el("lf-span").value,
      ratio: getLfRatio(),
      active: el("lf-active").checked,
      src: lfSrc,
    };

    const btn = el("lf-submit");
    btn.disabled = true;
    try {
      const result = lfEditingId
        ? await adminFetch(`/api/admin/lookbook/${encodeURIComponent(lfEditingId)}`, { method: "PATCH", body: JSON.stringify(body) })
        : await adminFetch("/api/admin/lookbook", { method: "POST", body: JSON.stringify(body) });

      if (!result) return;
      toast(t("저장했습니다"));
      resetLookbookForm();
      paintAdminLookbook();
    } finally {
      btn.disabled = false;
    }
  });

  el("lf-cancel").addEventListener("click", () => resetLookbookForm());
  resetLookbookForm();

  const lookbookState = { page: 0, pageSize: 50, total: 0, items: [] };

  function lookbookRowHTML(item) {
    return `
      <div class="panel" data-id="${esc(item.id)}" style="display:flex;gap:12px;align-items:center">
        ${item.src
          ? `<img src="${esc(item.src)}" style="width:56px;height:56px;object-fit:cover;border-radius:8px;flex-shrink:0">`
          : `<div style="width:56px;height:56px;border-radius:8px;border:1px dashed var(--line);flex-shrink:0"></div>`}
        <div style="flex:1;min-width:0">
          <b>${esc(item.label)}</b> ${item.active ? "" : `<span class="small" style="color:var(--muted)">(${esc(t("비공개"))})</span>`}
          <div class="small">${esc(item.span)} · ${esc(item.ratio)}</div>
        </div>
        <button type="button" class="btn btn--sm admin-lookbook-edit" data-i18n="수정">수정</button>
        <button type="button" class="btn btn--sm btn--ghost admin-lookbook-delete" data-i18n="삭제">삭제</button>
      </div>`;
  }

  function renderAdminLookbook() {
    const hasMore = lookbookState.items.length < lookbookState.total;
    el("lookbook-list").innerHTML = lookbookState.items.map(lookbookRowHTML).join("") + loadMoreHTML(hasMore, "lookbook-list-more");

    el("lookbook-list").querySelectorAll(".admin-lookbook-edit").forEach((btn) =>
      btn.addEventListener("click", () => {
        const id = btn.closest("[data-id]").dataset.id;
        const item = lookbookState.items.find((x) => x.id === id);
        if (item) fillLookbookForm(item);
      })
    );
    el("lookbook-list").querySelectorAll(".admin-lookbook-delete").forEach((btn) =>
      btn.addEventListener("click", async () => {
        const id = btn.closest("[data-id]").dataset.id;
        if (!confirm(t("이 룩북 칸을 삭제하시겠습니까? 되돌릴 수 없습니다."))) return;
        await adminFetch(`/api/admin/lookbook/${encodeURIComponent(id)}`, { method: "DELETE" });
        if (lfEditingId === id) resetLookbookForm();
        toast(t("삭제했습니다"));
        paintAdminLookbook();
      })
    );

    el("lookbook-list-more")?.addEventListener("click", () => paintAdminLookbook(true));
  }

  async function paintAdminLookbook(loadMore = false) {
    lookbookState.page = loadMore ? lookbookState.page + 1 : 1;
    const result = await adminFetch(`/api/admin/lookbook?page=${lookbookState.page}&pageSize=${lookbookState.pageSize}`);
    if (!result) return;
    lookbookState.total = result.total;
    lookbookState.items = loadMore ? lookbookState.items.concat(result.items) : result.items;
    renderAdminLookbook();
  }

  /* /api/admin/orders 호출이 실제로 성공했을 때(=서버가 관리자로 인정했을 때)만 패널을 연다 —
     profile.role만 믿지 않는다(계정 페이지 관리자 판단 로직과 동일한 원칙). */
  async function tryShowAdminPanel(profile) {
    const orders = await adminFetch("/api/admin/orders");
    if (!orders) return false;
    el("admin-panel").hidden = false;
    el("works-topbar").hidden = false;
    el("works-greeting").textContent = t("{name}님, 안녕하세요.", { name: profile.name || profile.email });
    el("admin-orders").innerHTML = "";
    paintAdminOrders();
    paintAdminReturns();
    paintAdminInventory();
    paintAdminQna();
    paintAdminProducts();
    paintAdminReviews();
    paintAdminLookbook();
    return true;
  }

  /* ---------- 부팅 ---------- */
  (async () => {
    const client = await getSupabaseClient();
    if (!client) {
      el("no-server-notice").hidden = false;
      return;
    }

    const isRecovery = /type=recovery/.test(location.hash);
    const profile = isRecovery ? null : await getCurrentProfile();

    if (isRecovery) {
      el("auth-view").hidden = false;
      el("login-form").hidden = true;
      el("reset-confirm-form").hidden = false;
    } else if (!profile) {
      el("auth-view").hidden = false;
    } else {
      const ok = await tryShowAdminPanel(profile);
      if (!ok) {
        await client.auth.signOut();
        el("auth-view").hidden = false;
        el("li-err").textContent = t("관리자 계정으로만 접속할 수 있습니다.");
        el("li-err").classList.add("on");
      }
    }

    el("login-form")?.addEventListener("submit", async (e) => {
      e.preventDefault();
      const btn = el("li-submit");
      btn.disabled = true;
      const { error } = await client.auth.signInWithPassword({
        email: el("li-email").value.trim(),
        password: el("li-pw").value,
      });
      if (error) {
        el("li-err").textContent = t("이메일 또는 비밀번호가 올바르지 않습니다.");
        el("li-err").classList.add("on");
        btn.disabled = false;
        return;
      }
      location.reload();
    });

    el("forgot-pw-link")?.addEventListener("click", (e) => {
      e.preventDefault();
      el("login-form").hidden = true;
      el("reset-request-form").hidden = false;
    });

    el("rq-cancel")?.addEventListener("click", () => {
      el("reset-request-form").hidden = true;
      el("login-form").hidden = false;
    });

    el("reset-request-form")?.addEventListener("submit", async (e) => {
      e.preventDefault();
      const btn = el("rq-submit");
      btn.disabled = true;
      const { error } = await client.auth.resetPasswordForEmail(el("rq-email").value.trim(), {
        redirectTo: location.origin + "/",
      });
      btn.disabled = false;
      if (error) {
        el("rq-err").textContent = authErrorMessage(error);
        el("rq-err").classList.add("on");
        return;
      }
      toast(t("재설정 링크를 이메일로 보내드렸습니다."));
      el("reset-request-form").hidden = true;
      el("login-form").hidden = false;
    });

    el("reset-confirm-form")?.addEventListener("submit", async (e) => {
      e.preventDefault();
      const pw1 = el("rc-pw").value;
      const pw2 = el("rc-pw2").value;
      if (pw1.length < 6) {
        el("rc-err").textContent = t("비밀번호는 6자 이상이어야 합니다.");
        el("rc-err").classList.add("on");
        return;
      }
      if (pw1 !== pw2) {
        el("rc-err").textContent = t("비밀번호가 일치하지 않습니다.");
        el("rc-err").classList.add("on");
        return;
      }
      const btn = el("rc-submit");
      btn.disabled = true;
      const { error } = await client.auth.updateUser({ password: pw1 });
      btn.disabled = false;
      if (error) {
        el("rc-err").textContent = authErrorMessage(error);
        el("rc-err").classList.add("on");
        return;
      }
      toast(t("비밀번호가 변경되었습니다. 다시 로그인해 주세요."));
      await client.auth.signOut();
      location.href = "/";
    });

    el("logout")?.addEventListener("click", async () => {
      await client.auth.signOut();
      location.reload();
    });
  })();
</script>
</body>
</html>
