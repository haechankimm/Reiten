<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>REITEN WORKS</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="/assets/img/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="/assets/img/apple-touch-icon.png">
<!-- 홈 화면에 추가해 "웹 앱으로 열기"로 쓸 때 사파리 주소창 없이 진짜 앱처럼 켜지게 하고,
     홈 화면 아이콘 아래 이름도 URL 대신 "REITEN WORKS"로 뜨게 한다. -->
<link rel="manifest" href="/manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="REITEN WORKS">
<!-- black-translucent은 상태 표시줄을 화면 위에 그대로 덮어씌워서(오버레이), 그 안의
     시계·배터리 아이콘이 항상 흰색으로 고정된다 — 라이트 테마의 옅은 회색 상단바
     (--bg-surface) 위에서는 흰 아이콘이 거의 안 보이고, safe-area 여백 처리도 없어 로고·
     버튼이 노치 밑에 깔릴 수 있었다(2026-09 코드 감사에서 발견, 실제 사용 전에 미리 수정).
     default는 iOS가 자체적으로 불투명한 상태 표시줄 공간을 확보해주고 아이콘도 항상 어두운
     색으로 고정돼, 테마와 무관하게 항상 잘 보인다. -->
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="stylesheet" href="/assets/css/style.css">
<link rel="stylesheet" href="works.css">
</head>

<div class="shell">

    <div id="busy-bar" aria-hidden="true"></div>

      <button type="button" class="sidebar-toggle" id="sidebar-toggle" aria-label="메뉴 열기" data-i18n-attr="aria-label:메뉴 열기" aria-expanded="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
      <!-- 로고를 누르면 "오늘"(홈)으로(2026-11-11 — 눌러도 반응이 없어 이상하다는 요청) -->
      <a href="#" class="brand" id="brand-home" title="오늘(홈)으로" data-i18n-attr="title:오늘(홈)으로" style="text-decoration:none;color:inherit">
        <img src="/assets/img/logo-mark.png" class="brand-mark-img" alt="Reiten">
        <span class="brand-word">REITEN</span>
        <span class="brand-badge">WORKS</span>
      </a>
      <!-- 상단 검색(빠른 이동, 2026-11-11) — 메뉴·기능·주문/회원/문의 찾기. Ctrl/⌘+K 또는 "/". js/palette.js -->
      <div class="palette" id="palette" hidden>
        <svg class="palette-search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="palette-input" type="search" autocomplete="off" role="combobox" aria-expanded="false" aria-controls="palette-list" aria-label="메뉴·기능 검색" placeholder="메뉴·기능 검색 (⌘K)" data-i18n-attr="aria-label:메뉴·기능 검색|placeholder:메뉴·기능 검색 (⌘K)">
        <ul id="palette-list" role="listbox" hidden></ul>
      </div>
      <div class="topbar-right">
        <div class="notif-wrap" id="notif-wrap" hidden>
          <button type="button" class="icon-btn" id="notif-toggle" aria-label="알림" data-i18n-attr="aria-label:알림">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M18 8a6 6 0 1 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
            <span class="notif-badge" id="notif-badge" hidden>0</span>
          </button>
          <div class="notif-panel" id="notif-panel" hidden>
            <div class="notif-panel-head" data-i18n="알림">알림</div>
            <div id="notif-list"></div>
          </div>
        </div>
        <span class="admin-chip" id="admin-chip" hidden>
          <span class="admin-avatar" id="admin-avatar"></span>
          <span><span class="admin-name" id="admin-name"></span><span class="admin-role" id="admin-role-text"> · 관리자</span></span>
        </span>
        <div class="seg" id="admin-lang-switch">
          <button type="button" data-admin-lang="ko" aria-pressed="true">KO</button>
          <button type="button" data-admin-lang="de" aria-pressed="false">DE</button>
        </div>
        <button type="button" class="icon-btn" id="theme-toggle" aria-label="테마 전환" data-i18n-attr="aria-label:테마 전환">
          <svg class="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.4M12 19.1v2.4M4.6 4.6l1.7 1.7M17.7 17.7l1.7 1.7M2.5 12h2.4M19.1 12h2.4M4.6 19.4l1.7-1.7M17.7 6.3l1.7-1.7"/></svg>
          <svg class="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a6.8 6.8 0 0 0 10.5 10.5Z"/></svg>
        </button>
        <button type="button" class="btn btn--sm btn--ghost topbar-act" id="change-pin" hidden aria-label="PIN 변경" data-i18n-attr="aria-label:PIN 변경"><svg class="act-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg><span class="act-txt" data-i18n="PIN 변경">PIN 변경</span></button>
        <button type="button" class="btn btn--sm topbar-act" id="logout" hidden aria-label="로그아웃" data-i18n-attr="aria-label:로그아웃"><svg class="act-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M14 4h4a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-4"/><path d="M10 16l-4-4 4-4M6 12h10"/></svg><span class="act-txt" data-i18n="로그아웃">로그아웃</span></button>
      </div>
    </header>

    <div class="content">
      <div class="notice" id="no-server-notice" hidden>
        <span data-i18n="서버(server/)가 꺼져 있어 로그인할 수 없습니다.">서버(server/)가 꺼져 있어 로그인할 수 없습니다.</span>

      <!-- ============ 로그인 ============ -->
