<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>REITEN WORKS</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="/assets/img/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="/assets/img/apple-touch-icon.png">
<link rel="stylesheet" href="/assets/css/style.css">
<style>
  /* =========================================================
     Works 전용 대시보드 스킨. style.css는 계속 불러와서 .panel/.field/.btn/
     .chip/.checkbox/.upload-btn 같은 컴포넌트는 그대로 재사용하되, 그 컴포넌트가
     참조하는 토큰(--paper/--ink/--line 등)을 여기서 재정의해서 색만 새로 입힌다
     (컴포넌트 CSS 자체는 안 건드림 — 상품/룩북 폼을 다시 짤 필요가 없어짐).
     ========================================================= */
  :root {
    --paper: #ffffff; --paper-2: #f5f6f8; --paper-3: #eceef2;
    --ink: #14161b; --ink-soft: #3a3f4a; --muted: #8b93a1;
    --line: #e3e6eb; --line-soft: #eceef2; --field: #ffffff; --shade: #eceef2;
    --danger: #b3261e; --ok: #1f8a4c;
    --radius: 6px;
    color-scheme: light;

    --bg-canvas: #ffffff; --bg-surface: #f5f6f8; --bg-surface-2: #eceef2;
    --text-primary: #14161b; --text-secondary: #565d6b; --text-muted: #8b93a1;
    --border: #e3e6eb; --accent: #3e5dc4; --accent-soft: #eaeefb; --accent-contrast: #ffffff;
    --status-pending-ink: #9a6b12;   --status-pending-bg: #fbf0dc;
    --status-confirmed-ink: #0e7c86; --status-confirmed-bg: #e1f5f3;
    --status-shipping-ink: #6b4fb6;  --status-shipping-bg: #efeafb;
    --status-done-ink: #1f8a4c;      --status-done-bg: #e6f6ec;
    --status-neutral-ink: #5b6270;   --status-neutral-bg: #eef0f3;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { color-scheme: dark;
      --paper: #313338; --paper-2: #2b2d31; --paper-3: #26282c;
      --ink: #dbdee1; --ink-soft: #c3c7cc; --muted: #84898f;
      --line: #3f4147; --line-soft: #35373c; --field: #26282c; --shade: #3a3c42;
      --danger: #f3897e; --ok: #79e0a0;

      --bg-canvas: #313338; --bg-surface: #2b2d31; --bg-surface-2: #3a3c42;
      --text-primary: #dbdee1; --text-secondary: #b5bac1; --text-muted: #84898f;
      --border: #3f4147; --accent: #8398ee; --accent-soft: rgba(131,152,238,0.14); --accent-contrast: #10142a;
      --status-pending-ink: #e3b25c;   --status-pending-bg: rgba(227,178,92,0.14);
      --status-confirmed-ink: #55d6cb; --status-confirmed-bg: rgba(85,214,203,0.14);
      --status-shipping-ink: #bba8f7;  --status-shipping-bg: rgba(187,168,247,0.14);
      --status-done-ink: #79e0a0;      --status-done-bg: rgba(121,224,160,0.14);
      --status-neutral-ink: #adb3bc;   --status-neutral-bg: rgba(173,179,188,0.12);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --paper: #313338; --paper-2: #2b2d31; --paper-3: #26282c;
    --ink: #dbdee1; --ink-soft: #c3c7cc; --muted: #84898f;
    --line: #3f4147; --line-soft: #35373c; --field: #26282c; --shade: #3a3c42;
    --danger: #f3897e; --ok: #79e0a0;

    --bg-canvas: #313338; --bg-surface: #2b2d31; --bg-surface-2: #3a3c42;
    --text-primary: #dbdee1; --text-secondary: #b5bac1; --text-muted: #84898f;
    --border: #3f4147; --accent: #8398ee; --accent-soft: rgba(131,152,238,0.14); --accent-contrast: #10142a;
    --status-pending-ink: #e3b25c;   --status-pending-bg: rgba(227,178,92,0.14);
    --status-confirmed-ink: #55d6cb; --status-confirmed-bg: rgba(85,214,203,0.14);
    --status-shipping-ink: #bba8f7;  --status-shipping-bg: rgba(187,168,247,0.14);
    --status-done-ink: #79e0a0;      --status-done-bg: rgba(121,224,160,0.14);
    --status-neutral-ink: #adb3bc;   --status-neutral-bg: rgba(173,179,188,0.12);
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --paper: #ffffff; --paper-2: #f5f6f8; --paper-3: #eceef2;
    --ink: #14161b; --ink-soft: #3a3f4a; --muted: #8b93a1;
    --line: #e3e6eb; --line-soft: #eceef2; --field: #ffffff; --shade: #eceef2;
    --danger: #b3261e; --ok: #1f8a4c;

    --bg-canvas: #ffffff; --bg-surface: #f5f6f8; --bg-surface-2: #eceef2;
    --text-primary: #14161b; --text-secondary: #565d6b; --text-muted: #8b93a1;
    --border: #e3e6eb; --accent: #3e5dc4; --accent-soft: #eaeefb; --accent-contrast: #ffffff;
    --status-pending-ink: #9a6b12;   --status-pending-bg: #fbf0dc;
    --status-confirmed-ink: #0e7c86; --status-confirmed-bg: #e1f5f3;
    --status-shipping-ink: #6b4fb6;  --status-shipping-bg: #efeafb;
    --status-done-ink: #1f8a4c;      --status-done-bg: #e6f6ec;
    --status-neutral-ink: #5b6270;   --status-neutral-bg: #eef0f3;
  }

  html, body { margin: 0; padding: 0; }
  body { background: var(--bg-canvas); color: var(--text-primary); font-size: 13px; }
  .tnum { font-variant-numeric: tabular-nums; }

  /* .sidebar/.admin-chip/.btn 등 여기저기서 display:flex를 지정하는 클래스와 hidden 속성이
     같이 붙으면, 브라우저 기본 스타일시트([hidden]{display:none})보다 이 파일의 클래스 규칙이
     우선 적용돼(둘 다 저작자 스타일시트가 아니라 오리진이 달라서) 오히려 보여버린다.
     hidden이 항상 이기도록 한 줄로 강제한다. */
  [hidden] { display: none !important; }

  .shell { display: flex; min-height: 100vh; }

  .sidebar {
    width: 208px; flex-shrink: 0;
    background: var(--bg-surface); border-right: 1px solid var(--border);
    padding: 14px 10px; display: flex; flex-direction: column; gap: 2px;
  }
  .sidebar-heading { font-size: 10.5px; letter-spacing: .07em; text-transform: uppercase; color: var(--text-muted); padding: 6px 10px 8px; }
  .nav-item {
    appearance: none; border: none; background: transparent; color: var(--text-secondary);
    display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: 6px; cursor: pointer;
    text-align: left; width: 100%; font-size: 12.5px; font-weight: 500; border-left: 2px solid transparent;
    transition: background-color .12s ease, color .12s ease;
  }
  .nav-item svg { width: 16px; height: 16px; flex-shrink: 0; opacity: .85; }
  .nav-item:hover { background: var(--bg-surface-2); color: var(--text-primary); }
  .nav-item.is-active { background: var(--accent-soft); color: var(--accent); border-left-color: var(--accent); }
  .nav-item.is-active svg { opacity: 1; }

  .main { flex: 1; min-width: 0; display: flex; flex-direction: column; }

  .topbar { height: 48px; flex-shrink: 0; display: flex; align-items: center; gap: 14px; padding: 0 16px;
    background: var(--bg-surface); border-bottom: 1px solid var(--border); }
  .brand { display: flex; align-items: center; gap: 9px; }
  .brand-mark-img { height: 20px; width: auto; display: block; }
  :root[data-theme="dark"] .brand-mark-img { filter: invert(1); }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .brand-mark-img { filter: invert(1); } }
  .brand-word { font-weight: 800; font-size: 14.5px; letter-spacing: -.01em; color: var(--text-primary); }
  .brand-badge { font-size: 9.5px; font-weight: 700; letter-spacing: .07em; color: var(--text-muted);
    border: 1px solid var(--border); border-radius: 4px; padding: 2px 5px; }
  .topbar-right { margin-left: auto; display: flex; align-items: center; gap: 10px; }

  .admin-chip { display: flex; align-items: center; gap: 6px; padding: 4px 8px 4px 4px; border-radius: 999px; background: var(--bg-surface-2); }
  .admin-avatar { width: 20px; height: 20px; border-radius: 50%; background: var(--accent); color: var(--accent-contrast);
    display: flex; align-items: center; justify-content: center; font-size: 10.5px; font-weight: 800; flex-shrink: 0; }
  .admin-name { font-size: 12px; font-weight: 600; }
  .admin-role { font-size: 10.5px; color: var(--text-muted); }

  .seg { display: flex; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
  .seg button { appearance: none; border: none; background: var(--bg-canvas); color: var(--text-secondary);
    padding: 5px 9px; font-size: 11.5px; font-weight: 600; cursor: pointer; transition: background-color .12s ease, color .12s ease; }
  .seg button + button { border-left: 1px solid var(--border); }
  .seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-contrast); }

  .icon-btn { appearance: none; border: 1px solid var(--border); background: var(--bg-canvas); color: var(--text-secondary);
    width: 28px; height: 28px; border-radius: 6px; display: flex; align-items: center; justify-content: center; cursor: pointer;
    transition: background-color .12s ease, color .12s ease; }
  .icon-btn:hover { background: var(--bg-surface-2); color: var(--text-primary); }
  .icon-btn svg { width: 15px; height: 15px; }
  .icon-btn .i-moon { display: none; }
  :root[data-theme="dark"] .icon-btn .i-sun { display: none; }
  :root[data-theme="dark"] .icon-btn .i-moon { display: block; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) .icon-btn .i-sun { display: none; }
    :root:not([data-theme="light"]) .icon-btn .i-moon { display: block; }
  }

  /* style.css의 .btn 기본값은 --ink/--paper를 쓰는데, 다크 테마에서는 --ink가 밝은 색으로
     뒤집혀서 저장 버튼이 흰색 알약처럼 보인다. 사이드바·세그먼트와 같은 포인트 컬러(--accent)로
     통일하고, 삭제류 액션만 --danger로 분리해 취소/제거와 구분한다. */
  .btn { background: var(--accent); border-color: var(--accent); color: var(--accent-contrast); }
  .btn:hover { opacity: .9; }
  .btn--ghost { background: transparent; border-color: var(--border); color: var(--text-secondary); }
  .btn--ghost:hover { background: var(--bg-surface-2); color: var(--text-primary); border-color: var(--border); opacity: 1; }
  .btn--danger { background: transparent; border-color: var(--danger); color: var(--danger); }
  .btn--danger:hover { background: var(--danger); color: var(--accent-contrast); opacity: 1; }
  .btn[disabled] { opacity: .35; }

  .content { flex: 1; overflow: auto; padding: 18px 20px 40px; }
  .content-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 14px; flex-wrap: wrap; }
  .content-title { font-size: 15px; font-weight: 700; }
  .content-sub { font-size: 11.5px; color: var(--text-muted); margin-top: 2px; }

  .status-chip { display: inline-flex; align-items: center; gap: 5px; padding: 2px 8px; border-radius: 999px; font-size: 11px; font-weight: 700; white-space: nowrap; }
  .status-chip::before { content: ""; width: 5px; height: 5px; border-radius: 50%; background: currentColor; }
  .st-pending { color: var(--status-pending-ink); background: var(--status-pending-bg); }
  .st-confirmed { color: var(--status-confirmed-ink); background: var(--status-confirmed-bg); }
  .st-shipping { color: var(--status-shipping-ink); background: var(--status-shipping-bg); }
  .st-done { color: var(--status-done-ink); background: var(--status-done-bg); }
  .st-neutral { color: var(--status-neutral-ink); background: var(--status-neutral-bg); }

  .split { display: grid; grid-template-columns: 320px 1fr; gap: 14px; align-items: start; }
  @media (max-width: 960px) { .split { grid-template-columns: 1fr; } }
  .split-rev { display: grid; grid-template-columns: 1.3fr 380px; gap: 20px; align-items: start; }
  @media (max-width: 960px) { .split-rev { grid-template-columns: 1fr; } }
  .plist { border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  .prow { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 8px; width: 100%;
    appearance: none; border: none; border-bottom: 1px solid var(--border); background: var(--bg-canvas); color: var(--text-primary);
    padding: 10px 12px; cursor: pointer; text-align: left; border-left: 2px solid transparent; }
  .plist > .prow:last-of-type { border-bottom: none; }
  .prow:hover { background: var(--bg-surface); }
  .prow.is-selected { background: var(--accent-soft); border-left-color: var(--accent); }
  .prow-id { font-weight: 700; font-size: 12px; }
  .prow-sub { font-size: 11px; color: var(--text-muted); margin-top: 1px; }
  .prow-amount { font-size: 12px; font-weight: 700; }

  .detail { border: 1px solid var(--border); border-radius: 8px; padding: 16px; background: var(--bg-canvas); }
  .detail-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 14px; }
  .detail-title { font-size: 14px; font-weight: 800; }
  .detail-sub { font-size: 11.5px; color: var(--text-muted); margin-top: 2px; }
  .detail-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 16px; }
  .detail-field label { display: block; font-size: 10.5px; letter-spacing: .04em; text-transform: uppercase; color: var(--text-muted); margin-bottom: 4px; }
  .detail-field div { font-size: 12.5px; }
  .detail-items { border-top: 1px solid var(--border); padding-top: 12px; display: flex; flex-direction: column; gap: 6px; }
  .detail-item { display: flex; justify-content: space-between; font-size: 12px; gap: 12px; }
  .detail-total { display: flex; justify-content: space-between; font-size: 13px; font-weight: 800; margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--border); }
  .detail-ship { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
  .detail-ship select, .detail-ship input, .mini-select { border: 1px solid var(--border); background: var(--bg-canvas); color: var(--text-primary);
    border-radius: 6px; padding: 6px 9px; font-size: 12px; }
  .detail-ship select { min-width: 120px; }
  .detail-ship input { flex: 1; min-width: 140px; }
  .primary-btn { appearance: none; border: none; background: var(--accent); color: var(--accent-contrast); border-radius: 6px;
    padding: 6px 14px; font-size: 12px; font-weight: 700; cursor: pointer; }

  .auth-wrap { display: flex; justify-content: center; padding-top: 8vh; }
  .auth-card { width: 100%; max-width: 360px; border: 1px solid var(--border); border-radius: 10px; padding: 24px; background: var(--bg-canvas); }
  .remember-row { display: flex; align-items: center; margin: 10px 0 16px; }
  .remember-row .checkbox { font-size: 12px; }

  /* ---------- 상품: 한눈에 보이는 카드 그리드 ---------- */
  .grid-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(168px, 1fr)); gap: 12px; }
  .grid-card { border: 1px solid var(--border); border-radius: 8px; overflow: hidden; background: var(--bg-canvas); display: flex; flex-direction: column; }
  .grid-card-thumb { position: relative; aspect-ratio: 1; background: var(--bg-surface-2); }
  .grid-card-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .grid-card-badge { position: absolute; top: 6px; left: 6px; font-size: 9.5px; font-weight: 700; padding: 2px 6px; border-radius: 4px; background: var(--bg-canvas); color: var(--text-muted); border: 1px solid var(--border); }
  .grid-card-body { padding: 8px 10px 2px; }
  .grid-card-body b { font-size: 12px; display: block; line-height: 1.35; }
  /* flex-wrap + min-width: 독일어처럼 버튼 글자가 길어지면 한 줄에 다 안 들어갈 수 있는데,
     그때는 잘리는 대신 버튼이 다음 줄로 자연스럽게 넘어가게 한다(ellipsis는 최후의 안전장치). */
  .grid-card-actions { display: flex; flex-wrap: wrap; gap: 6px; padding: 8px 10px 10px; margin-top: auto; }
  .grid-card-actions .btn { flex: 1 1 auto; min-width: 64px; padding: 0 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* ---------- 룩북: 실제 배치를 그대로 흉내 낸 클릭형 미리보기 ---------- */
  .look-grid { display: grid; grid-template-columns: repeat(12, 1fr); gap: 8px; }
  .look-tile { position: relative; grid-column: span 4; border: 2px solid var(--border); border-radius: 6px; overflow: hidden;
    padding: 0; cursor: pointer; background: var(--bg-surface-2); min-height: 64px; }
  .look-tile.w6 { grid-column: span 6; }
  .look-tile.w8 { grid-column: span 8; }
  .look-tile.w12 { grid-column: span 12; }
  .look-tile img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .look-tile-empty { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 10.5px; color: var(--text-muted); text-align: center; padding: 4px; }
  .look-tile-label { position: absolute; left: 7px; bottom: 6px; font-size: 10.5px; font-weight: 700; color: #fff; text-shadow: 0 1px 4px rgba(0,0,0,.7); }
  .look-tile-hidden { position: absolute; top: 6px; right: 6px; font-size: 9px; font-weight: 700; padding: 2px 6px; border-radius: 4px; background: rgba(0,0,0,.6); color: #fff; }
  .look-tile:hover { border-color: var(--accent); }
  .look-tile.is-editing { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
  .look-tile-add { display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; color: var(--text-muted);
    border-style: dashed; background: transparent; }
  .look-tile-add:hover { color: var(--accent); border-color: var(--accent); }

  /* ---------- 감사 로그 ---------- */
  .logrow { display: grid; grid-template-columns: 148px 190px 150px 1fr; gap: 10px; padding: 9px 12px;
    border-bottom: 1px solid var(--border); font-size: 12px; align-items: baseline; }
  .logrow:last-child { border-bottom: none; }
  .logrow-head { color: var(--text-muted); font-size: 10.5px; letter-spacing: .04em; text-transform: uppercase; font-weight: 700; }
  .logrow-action { font-weight: 700; }
  .logrow-detail { color: var(--text-secondary); font-size: 11px; margin-top: 2px; }
  @media (max-width: 720px) { .logrow { grid-template-columns: 1fr; gap: 2px; } }

  /* ---------- 대시보드 ---------- */
  .stat-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 14px; }
  .stat-tile { border: 1px solid var(--border); border-radius: 8px; padding: 14px 16px; background: var(--bg-canvas); }
  .stat-tile-label { font-size: 11px; color: var(--text-muted); letter-spacing: .03em; }
  .stat-tile-value { font-size: 22px; font-weight: 800; margin-top: 6px; }
  .stat-tile-sub { font-size: 11px; color: var(--text-muted); margin-top: 4px; }
  .chart-bars { display: flex; align-items: flex-end; gap: 6px; height: 140px; margin-top: 14px; }
  .chart-bar-col { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px; height: 100%; justify-content: flex-end; }
  .chart-bar { width: 100%; max-width: 28px; background: var(--accent); border-radius: 3px 3px 0 0; min-height: 2px; }
  .chart-bar-label { font-size: 9.5px; color: var(--text-muted); white-space: nowrap; }
  .best-row { display: grid; grid-template-columns: 28px 1fr auto; gap: 10px; align-items: center; padding: 7px 0; border-bottom: 1px solid var(--border); font-size: 12.5px; }
  .best-row:last-child { border-bottom: none; }
  .best-rank { color: var(--text-muted); font-weight: 700; font-size: 11px; }
  .best-bar-track { grid-column: 1/-1; height: 5px; border-radius: 3px; background: var(--bg-surface-2); overflow: hidden; margin-top: 2px; }
  .best-bar-fill { height: 100%; background: var(--accent); border-radius: 3px; }

  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>

<div class="shell">
  <aside class="sidebar" id="sidebar" hidden>
    <div class="sidebar-heading" data-i18n="업무">업무</div>
    <button type="button" class="nav-item is-active" data-tab="orders">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3.5" y="3.5" width="17" height="17" rx="2.5"/><path d="M8 9h8M8 13h5"/></svg>
      <span data-i18n="전체 주문">전체 주문</span>
    </button>

        <div id="admin-dashboard" style="display:grid;gap:20px" hidden>
          <div id="dashboard-stats" class="stat-row"></div>
          <div class="panel">
            <b data-i18n="최근 14일 매출">최근 14일 매출</b>
            <div id="dashboard-revenue-chart" class="chart-bars"></div>
          </div>
          <div class="panel">
            <b data-i18n="베스트셀러 (수량 기준)">베스트셀러 (수량 기준)</b>
            <div id="dashboard-bestsellers" style="margin-top:10px"></div>
          </div>
        </div>

        <div id="admin-auditlog" style="display:grid;gap:12px" hidden>
          <div class="plist">
            <div class="logrow logrow-head">
              <span data-i18n="시간">시간</span>
              <span data-i18n="관리자">관리자</span>
              <span data-i18n="작업">작업</span>
              <span data-i18n="대상">대상</span>
            </div>
            <div id="auditlog-rows"></div>
          </div>
          <div id="auditlog-more-wrap"></div>
        </div>
      </section>
    </div>
  </div>
</div>

<script src="/assets/js/data.js"></script>
<script src="/assets/js/i18n.js"></script>
<script src="/assets/js/auth-client.js"></script>
<script>
  /* account.html의 관리자 패널 로직을 그대로 옮겨왔다 — 소비자용 app.js(헤더/테마/배너 애니메이션 등)는
     Works에서 쓸 일이 없어 아예 불러오지 않고, 거기서 쓰던 esc/money/toast만 최소한으로 다시 정의한다. */
  const el = (id) => document.getElementById(id);
  const esc = (s) =>
    String(s ?? "").replace(/[&<>"']/g, (c) =>
      ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])
    );
  const money = (n) => {
    const num = Number(n || 0);
    return getLang() === "ko" ? num.toLocaleString("ko-KR") + "원" : "₩" + num.toLocaleString("en-US");
  };

  let toastTimer;
  function toast(msg) {
    let t = document.querySelector(".toast");
    if (!t) {
      t = document.createElement("div");
      t.className = "toast";
      t.setAttribute("role", "status");
      document.body.appendChild(t);
    }
    t.textContent = msg;
    requestAnimationFrame(() => t.classList.add("on"));
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove("on"), 2600);
  }

  /* 라이트/다크는 기본적으로 OS 설정을 따르고, 한 번 수동으로 바꾸면 그 이후로는
     기기와 무관하게 그 선택을 기억한다(로컬에만 저장, 서버에는 안 감). */
  const savedTheme = localStorage.getItem("works_theme");
  if (savedTheme === "dark" || savedTheme === "light") document.documentElement.setAttribute("data-theme", savedTheme);
  el("theme-toggle").addEventListener("click", () => {
    const root = document.documentElement;
    const current = root.getAttribute("data-theme") || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    const next = current === "dark" ? "light" : "dark";
    root.setAttribute("data-theme", next);
    localStorage.setItem("works_theme", next);
  });

  applyI18n();

  function authErrorMessage(error) {
    const msg = String((error && error.message) || "");
    if (/password.*(least|weak)/i.test(msg)) return t("비밀번호는 6자 이상이어야 합니다.");
    if (/invalid.*email/i.test(msg)) return t("이메일 형식이 올바르지 않습니다.");
    if (/rate limit/i.test(msg)) return t("요청이 너무 많습니다. 잠시 후 다시 시도해주세요.");
    return msg;
  }

  const ORDER_STATUSES = ["입금대기", "입금확인", "배송중", "완료", "취소"];
  const RETURN_STATUSES = ["접수", "처리중", "완료", "반려"];
  const ORDER_STATUS_CLASS = { "입금대기": "st-pending", "입금확인": "st-confirmed", "배송중": "st-shipping", "완료": "st-done", "취소": "st-neutral" };

  function fmtDate(iso) {
    return new Date(iso).toLocaleDateString(getLang() === "de" ? "de-DE" : "ko-KR");
  }

  /* ---------- 사이드바 탭 전환 ---------- */
  function switchTabs(navSelector, panelIds) {
    document.querySelectorAll(navSelector).forEach((b) =>
      b.addEventListener("click", () => {
        document.querySelectorAll(navSelector).forEach((x) => x.classList.toggle("is-active", x === b));
        Object.keys(panelIds).forEach((key) => (el(panelIds[key]).hidden = key !== b.dataset.tab));
      })
    );
  }
  switchTabs("#sidebar .nav-item", { orders: "admin-orders", returns: "admin-returns", inventory: "admin-inventory", qna: "admin-qna", products: "admin-products", reviews: "admin-reviews", lookbook: "admin-lookbook", settings: "admin-settings", dashboard: "admin-dashboard", auditlog: "admin-auditlog" });

  el("admin-lang-switch").querySelectorAll("[data-admin-lang]").forEach((b) => {
    b.setAttribute("aria-pressed", b.dataset.adminLang === getLang() ? "true" : "false");
    b.addEventListener("click", () => setLang(b.dataset.adminLang));
  });

  async function adminFetch(path, opts) {
    const token = await getAccessToken();
    if (!token) {
      toast(t("로그인이 만료되었습니다. 다시 로그인해 주세요."));
      return null;
    }
    const res = await fetch(path, {
      ...opts,
      headers: { "Content-Type": "application/json", Authorization: "Bearer " + token, ...(opts && opts.headers) },
    });
    if (!res.ok) {
      if (res.status === 401) {
        toast(t("로그인이 만료되었습니다. 다시 로그인해 주세요."));
      } else {
        let message = "";
        try { message = (await res.json()).error || ""; } catch (e) {}
        toast(message || t("요청이 실패했습니다") + ` (${res.status})`);
      }
      return null;
    }
    return res.json();
  }

  function loadMoreHTML(hasMore, id) {
    if (!hasMore) return "";
    return `<div style="grid-column:1/-1;text-align:center;margin-top:8px">
      <button type="button" id="${id}" class="btn btn--sm btn--ghost">${esc(t("더 보기"))}</button>
    </div>`;
  }

  /* ---------- 전체 주문 (리스트 + 디테일 패널) ---------- */
  const ordersState = { page: 0, pageSize: 20, total: 0, items: [] };
  let selectedOrderNo = null;

  function orderStatusChip(status) {
    return `<span class="status-chip ${ORDER_STATUS_CLASS[status] || "st-neutral"}">${esc(t(status))}</span>`;
  }

  function orderListRowHTML(o) {
    return `
      <button type="button" class="prow ${o.no === selectedOrderNo ? "is-selected" : ""}" data-no="${esc(o.no)}">
        <span>
          <span class="prow-id">${esc(o.no)}</span>
          <div class="prow-sub">${esc(o.customer.name)} · ${o.items.map((it) => `${esc(it.name)} × ${it.qty}`).join(", ")}</div>
        </span>
        <span style="text-align:right">
          <div class="prow-amount tnum">${money(o.total)}</div>
          <div style="margin-top:3px">${orderStatusChip(o.status)}</div>
        </span>
      </button>`;
  }

  function orderDetailHTML(o) {
    return `
      <div class="detail-head">
        <div>
          <div class="detail-title tnum">${esc(o.no)}</div>
          <div class="detail-sub tnum">${fmtDate(o.at)}</div>
        </div>
        ${orderStatusChip(o.status)}
      </div>
      <div class="detail-grid">
        <div class="detail-field"><label>${esc(t("주문자"))}</label><div>${esc(o.customer.name)} · ${esc(o.customer.tel)}</div></div>
        <div class="detail-field"><label>${esc(t("배송지"))}</label><div>[${esc(o.customer.zip)}] ${esc(o.customer.addr)} ${esc(o.customer.addr2 || "")}</div></div>
        <div class="detail-field"><label>${esc(t("입금자명"))}</label><div>${esc(o.customer.payer)}</div></div>
        <div class="detail-field"><label>${esc(t("메모"))}</label><div>${esc(o.customer.memo || "-")}</div></div>
      </div>
      <div class="detail-items">
        ${o.items.map((it) => `<div class="detail-item"><span>${esc(it.name)} (${esc(it.options)}) × ${it.qty}</span><span class="tnum">${money(it.sum)}</span></div>`).join("")}
        <div class="detail-total"><span>${esc(t("총 결제금액"))}</span><span class="tnum">${money(o.total)}</span></div>
      </div>
      <div class="detail-field" style="margin-top:16px">
        <label>${esc(t("상태"))}</label>
        <select class="mini-select" id="od-status">${ORDER_STATUSES.map((s) => `<option value="${s}" ${s === o.status ? "selected" : ""}>${esc(t(s))}</option>`).join("")}</select>
      </div>
      <div class="detail-ship">
        <select id="od-courier">
          <option value="" ${!o.courier ? "selected" : ""}>${esc(t("택배사 선택"))}</option>
          ${COURIERS.map((c) => `<option value="${c.key}" ${c.key === o.courier ? "selected" : ""}>${esc(c.label)}</option>`).join("")}
        </select>
        <input type="text" id="od-tracking" placeholder="${esc(t("운송장번호"))}" value="${esc(o.trackingNo || "")}">
        <button type="button" class="primary-btn" id="od-save">${esc(t("저장"))}</button>
      </div>`;
  }

  function renderOrdersSplit() {
    const hasMore = ordersState.items.length < ordersState.total;
    el("orders-plist").innerHTML = ordersState.items.map(orderListRowHTML).join("") + loadMoreHTML(hasMore, "admin-orders-more");
    el("orders-summary").textContent = t("총 {n}건", { n: ordersState.total });

    el("orders-plist").querySelectorAll(".prow").forEach((btn) =>
      btn.addEventListener("click", () => { selectedOrderNo = btn.dataset.no; renderOrdersSplit(); })
    );
    el("admin-orders-more")?.addEventListener("click", () => paintAdminOrders(true));

    if (!selectedOrderNo && ordersState.items.length) selectedOrderNo = ordersState.items[0].no;
    const o = ordersState.items.find((x) => x.no === selectedOrderNo);
    el("orders-detail").innerHTML = o ? orderDetailHTML(o) : `<p class="small" style="padding:4px">${esc(t("주문이 없습니다"))}</p>`;

    if (o) {
      el("od-status").addEventListener("change", async () => {
        const status = el("od-status").value;
        await adminFetch(`/api/admin/orders/${encodeURIComponent(o.no)}`, { method: "PATCH", body: JSON.stringify({ status }) });
        o.status = status;
        toast(t("상태를 저장했습니다"));
        renderOrdersSplit();
      });
      el("od-save").addEventListener("click", async () => {
        const courier = el("od-courier").value;
        const trackingNo = el("od-tracking").value.trim();
        await adminFetch(`/api/admin/orders/${encodeURIComponent(o.no)}`, { method: "PATCH", body: JSON.stringify({ courier, trackingNo }) });
        o.courier = courier;
        o.trackingNo = trackingNo;
        toast(t("배송정보를 저장했습니다"));
        renderOrdersSplit();
      });
    }
  }

  async function paintAdminOrders(loadMore = false) {
    ordersState.page = loadMore ? ordersState.page + 1 : 1;
    const result = await adminFetch(`/api/admin/orders?page=${ordersState.page}&pageSize=${ordersState.pageSize}`);
    if (!result) return;
    ordersState.total = result.total;
    ordersState.items = loadMore ? ordersState.items.concat(result.items) : result.items;
    renderOrdersSplit();
  }

  const returnsState = { page: 0, pageSize: 20, total: 0, items: [] };

  function returnCardHTML(r) {
    return `
      <div class="panel" data-id="${esc(r.id)}">
        <div style="display:flex;justify-content:space-between;gap:12px;align-items:baseline">
          <b class="tnum">${esc(r.orderNo)}</b>
          <span class="small tnum">${fmtDate(r.at)}</span>
        </div>
        <p class="small" style="margin-top:6px">${esc(r.contactName)} · ${esc(r.contactTel)}</p>
        <p style="margin-top:8px">${esc(r.reason)}${r.detail ? " — " + esc(r.detail) : ""}</p>
        <div style="margin-top:10px">
          <select class="admin-return-status">${RETURN_STATUSES.map((s) => `<option value="${s}" ${s === r.status ? "selected" : ""}>${esc(t(s))}</option>`).join("")}</select>
        </div>
      </div>`;
  }

  function renderAdminReturns() {
    const hasMore = returnsState.items.length < returnsState.total;
    el("admin-returns").innerHTML = returnsState.items.map(returnCardHTML).join("") + loadMoreHTML(hasMore, "admin-returns-more");

    el("admin-returns").querySelectorAll(".admin-return-status").forEach((sel) =>
      sel.addEventListener("change", async () => {
        const id = sel.closest("[data-id]").dataset.id;
        await adminFetch(`/api/admin/returns/${encodeURIComponent(id)}`, {
          method: "PATCH",
          body: JSON.stringify({ status: sel.value }),
        });
        toast(t("상태를 저장했습니다"));
      })
    );

    el("admin-returns-more")?.addEventListener("click", () => paintAdminReturns(true));
  }

  async function paintAdminReturns(loadMore = false) {
    returnsState.page = loadMore ? returnsState.page + 1 : 1;
    const result = await adminFetch(`/api/admin/returns?page=${returnsState.page}&pageSize=${returnsState.pageSize}`);
    if (!result) return;
    returnsState.total = result.total;
    returnsState.items = loadMore ? returnsState.items.concat(result.items) : result.items;
    renderAdminReturns();
  }

  async function paintAdminInventory() {
    const rows = await adminFetch("/api/admin/inventory");
    if (!rows) return;
    el("admin-inventory").innerHTML = rows
      .map(
        (r) => `
      <div style="display:flex;justify-content:space-between;gap:12px;align-items:center" data-product="${esc(r.productId)}" data-size="${esc(r.size)}">
        <span class="small">${esc(r.productId)} · ${esc(r.size)}</span>
        <input type="number" min="0" class="admin-inv-qty" value="${r.qty}" style="width:80px">
      </div>`
      )
      .join("");

    el("admin-inventory").querySelectorAll(".admin-inv-qty").forEach((input) =>
      input.addEventListener("change", async () => {
        const row = input.closest("[data-product]");
        await adminFetch("/api/admin/inventory", {
          method: "PATCH",
          body: JSON.stringify({ productId: row.dataset.product, size: row.dataset.size, qty: Number(input.value) }),
        });
        toast(t("재고를 저장했습니다"));
      })
    );
  }

  const qnaState = { page: 0, pageSize: 20, total: 0, items: [] };

  function qnaCardHTML(q) {
    return `
      <div class="panel" data-id="${esc(q.id)}">
        <div style="display:flex;justify-content:space-between;gap:12px;align-items:baseline">
          <b>${esc(q.name)}</b>
          <span class="small tnum">${fmtDate(q.at)}</span>
        </div>
        <div class="small" style="margin-top:6px">${esc(q.productId)} ${q.secret ? "· 🔒 " + esc(t("비밀글")) : ""}</div>
        <p style="margin-top:10px">${esc(q.question)}</p>
        ${
          q.status === "답변완료"
            ? `<div class="notice" style="margin-top:12px"><b>${esc(t("답변"))}</b><p style="margin-top:6px">${esc(q.answer)}</p></div>`
            : `
          <div class="field" style="margin-top:12px">
            <textarea class="admin-qna-answer" placeholder="${esc(t("답변을 입력하세요"))}"></textarea>
          </div>
          <button type="button" class="btn btn--sm admin-qna-submit">${esc(t("답변 등록"))}</button>`
        }
      </div>`;
  }

  function renderAdminQna() {
    const hasMore = qnaState.items.length < qnaState.total;
    el("admin-qna").innerHTML = qnaState.items.map(qnaCardHTML).join("") + loadMoreHTML(hasMore, "admin-qna-more");

    el("admin-qna").querySelectorAll(".admin-qna-submit").forEach((btn) =>
      btn.addEventListener("click", async () => {
        const card = btn.closest("[data-id]");
        const answer = card.querySelector(".admin-qna-answer").value.trim();
        if (!answer) { toast(t("답변 내용을 입력해 주세요.")); return; }
        btn.disabled = true;
        await adminFetch(`/api/admin/qna/${encodeURIComponent(card.dataset.id)}`, {
          method: "PATCH",
          body: JSON.stringify({ answer }),
        });
        toast(t("답변을 등록했습니다"));
        const idx = qnaState.items.findIndex((x) => x.id === card.dataset.id);
        if (idx > -1) qnaState.items[idx] = { ...qnaState.items[idx], answer, status: "답변완료" };
        renderAdminQna();
      })
    );

    el("admin-qna-more")?.addEventListener("click", () => paintAdminQna(true));
  }

  async function paintAdminQna(loadMore = false) {
    qnaState.page = loadMore ? qnaState.page + 1 : 1;
    const result = await adminFetch(`/api/admin/qna?page=${qnaState.page}&pageSize=${qnaState.pageSize}`);
    if (!result) return;
    qnaState.total = result.total;
    qnaState.items = loadMore ? qnaState.items.concat(result.items) : result.items;
    renderAdminQna();
  }

  /* ---------- 리뷰 승인 ---------- */
  const reviewsState = { page: 0, pageSize: 20, total: 0, items: [] };

  function stars(n) { return "★".repeat(n) + "☆".repeat(5 - n); }

  function reviewCardHTML(r) {
    return `
      <div class="panel" data-id="${esc(r.id)}">
        <div style="display:flex;justify-content:space-between;gap:12px;align-items:baseline">
          <b>${esc(r.name)}</b>
          <span class="small tnum">${fmtDate(r.at)}</span>
        </div>
        <div style="margin-top:6px;letter-spacing:.05em">${stars(r.rating)}</div>
        <div class="small" style="margin-top:6px">
          ${esc(r.productId)} ·
          ${r.approved ? `<span style="color:var(--ok)">${esc(t("게시중"))}</span>` : `<span style="color:var(--danger)">${esc(t("승인 대기"))}</span>`}
        </div>
        <p style="margin-top:10px">${esc(r.comment)}</p>
        ${r.photoUrl ? `<img src="${esc(r.photoUrl)}" alt="" loading="lazy" style="margin-top:10px;max-width:180px;border-radius:8px;display:block">` : ""}
        ${r.instagramHandle ? `<p class="small" style="margin-top:8px">Instagram @${esc(r.instagramHandle)}</p>` : ""}
        <div style="display:flex;gap:8px;margin-top:12px">
          <button type="button" class="btn btn--sm admin-review-toggle">${esc(r.approved ? t("숨기기") : t("승인"))}</button>
          <button type="button" class="btn btn--sm btn--danger admin-review-delete">${esc(t("삭제"))}</button>
        </div>
      </div>`;
  }

  function renderAdminReviews() {
    const hasMore = reviewsState.items.length < reviewsState.total;
    el("admin-reviews").innerHTML = reviewsState.items.map(reviewCardHTML).join("") + loadMoreHTML(hasMore, "admin-reviews-more");

    el("admin-reviews").querySelectorAll(".admin-review-toggle").forEach((btn) =>
      btn.addEventListener("click", async () => {
        const id = btn.closest("[data-id]").dataset.id;
        const item = reviewsState.items.find((x) => x.id === id);
        if (!item) return;
        const nextApproved = !item.approved;
        btn.disabled = true;
        await adminFetch(`/api/admin/reviews/${encodeURIComponent(id)}`, {
          method: "PATCH",
          body: JSON.stringify({ approved: nextApproved }),
        });
        item.approved = nextApproved;
        toast(nextApproved ? t("리뷰를 승인했습니다") : t("리뷰를 숨겼습니다"));
        renderAdminReviews();
      })
    );

    el("admin-reviews").querySelectorAll(".admin-review-delete").forEach((btn) =>
      btn.addEventListener("click", async () => {
        const id = btn.closest("[data-id]").dataset.id;
        if (!confirm(t("이 리뷰를 삭제하시겠습니까? 되돌릴 수 없습니다."))) return;
        await adminFetch(`/api/admin/reviews/${encodeURIComponent(id)}`, { method: "DELETE" });
        reviewsState.items = reviewsState.items.filter((x) => x.id !== id);
        reviewsState.total = Math.max(0, reviewsState.total - 1);
        toast(t("리뷰를 삭제했습니다"));
        renderAdminReviews();
      })
    );

    el("admin-reviews-more")?.addEventListener("click", () => paintAdminReviews(true));
  }

  async function paintAdminReviews(loadMore = false) {
    reviewsState.page = loadMore ? reviewsState.page + 1 : 1;
    const result = await adminFetch(`/api/admin/reviews?page=${reviewsState.page}&pageSize=${reviewsState.pageSize}`);
    if (!result) return;
    reviewsState.total = result.total;
    reviewsState.items = loadMore ? reviewsState.items.concat(result.items) : result.items;
    renderAdminReviews();
  }

  /* ---------- 상품 관리 ---------- */
  let pfEditingId = null;
  let pfImages = [null, null, null, null];
  let pfSelectedColors = [];
  const PF_SIZE_OPTIONS = ["XS", "S", "M", "L", "XL"];
  const CATEGORY_BASE = ["후드티", "후드집업", "크롭 후드티", "티셔츠"];
  let pfKnownCategories = [...CATEGORY_BASE];

  function renderPfCategory(selected) {
    const known = selected && !pfKnownCategories.includes(selected) ? [...pfKnownCategories, selected] : pfKnownCategories;
    el("pf-category").innerHTML =
      known.map((c) => `<option value="${esc(c)}">${esc(t(c))}</option>`).join("") +
      `<option value="__custom__">${esc(t("직접 입력 (새 카테고리)"))}</option>`;
    el("pf-category").value = selected && known.includes(selected) ? selected : known[0];
    el("pf-category-custom").hidden = true;
    el("pf-category-custom").value = "";
  }

  el("pf-category").addEventListener("change", () => {
    const isCustom = el("pf-category").value === "__custom__";
    el("pf-category-custom").hidden = !isCustom;
    if (isCustom) el("pf-category-custom").focus();
  });

  function renderPfColors() {
    el("pf-colors").innerHTML = Object.values(COLORS).map((c) => `
      <button type="button" class="chip pf-color" data-c="${c.key}" aria-pressed="${pfSelectedColors.includes(c.key)}">${esc(t(c.label))}</button>
    `).join("");
    el("pf-colors").querySelectorAll(".pf-color").forEach((b) =>
      b.addEventListener("click", () => {
        const k = b.dataset.c;
        pfSelectedColors = pfSelectedColors.includes(k) ? pfSelectedColors.filter((x) => x !== k) : [...pfSelectedColors, k];
        renderPfColors();
      })
    );
  }

  const PF_UPLOAD_ICON = `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h3l2-2h6l2 2h3a1 1 0 0 1 1 1v11a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V8a1 1 0 0 1 1-1Z"/><circle cx="12" cy="13" r="3.5"/></svg>`;

  function renderPfPhotos() {
    el("pf-photos").innerHTML = pfImages.map((url, i) => {
      const photoLabel = t("상품사진 {n}", { n: i + 1 });
      return `
      <div>
        <div class="small" style="margin-bottom:6px;font-weight:600">${esc(photoLabel)}</div>
        ${url
          ? `<img src="${esc(url)}" style="width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;border:1px solid var(--line)">`
          : `<div style="width:100%;aspect-ratio:1;border:1px dashed var(--line);border-radius:8px;display:flex;align-items:center;justify-content:center" class="small">${esc(t("사진 없음"))}</div>`}
        <div style="display:flex;flex-direction:column;gap:6px;margin-top:8px">
          <label class="upload-btn" style="cursor:pointer;justify-content:center;width:100%">
            ${PF_UPLOAD_ICON}
            <span>${esc(url ? t("사진 변경") : t("사진 선택"))}</span>
            <input type="file" accept="image/*" class="upload-input pf-photo-input" data-i="${i}">
          </label>
          ${url ? `<button type="button" class="btn btn--sm btn--ghost pf-photo-remove" data-i="${i}">${esc(t("제거"))}</button>` : ""}
        </div>
      </div>`;
    }).join("");
    el("pf-photos").querySelectorAll(".pf-photo-input").forEach((inp) => inp.addEventListener("change", () => onPfPhotoChange(inp)));
    el("pf-photos").querySelectorAll(".pf-photo-remove").forEach((btn) =>
      btn.addEventListener("click", () => { pfImages[Number(btn.dataset.i)] = null; renderPfPhotos(); })
    );
  }

  async function onPfPhotoChange(input) {
    const file = input.files[0];
    if (!file) return;
    const i = Number(input.dataset.i);
    const token = await getAccessToken();
    const fd = new FormData();
    fd.append("photo", file);
    input.disabled = true;
    try {
      const res = await fetch("/api/admin/products/photo", {
        method: "POST",
        headers: { Authorization: "Bearer " + token },
        body: fd,
      });
      if (!res.ok) throw new Error("failed");
      const { url } = await res.json();
      pfImages[i] = url;
      renderPfPhotos();
    } catch (e) {
      toast(t("사진 업로드에 실패했습니다"));
    }
  }

  function resetProductForm() {
    pfEditingId = null;
    pfImages = [null, null, null, null];
    pfSelectedColors = [];
    el("product-form-title").textContent = t("새 상품 추가");
    el("pf-id").value = "";
    el("pf-id").disabled = false;
    el("pf-name").value = "";
    el("pf-nameko").value = "";
    el("pf-type").value = "hoodie";
    renderPfCategory();
    el("pf-price").value = "";
    el("pf-badge").value = "";
    el("pf-short").value = "";
    el("pf-desc").value = "";
    el("pf-details").value = "";
    document.querySelectorAll(".pf-size").forEach((cb) => (cb.checked = true));
    el("pf-sizetable").value = "hoodie";
    el("pf-charmready").checked = false;
    el("pf-active").checked = true;
    el("pf-cancel").hidden = true;
    renderPfColors();
    renderPfPhotos();
  }

  function fillProductForm(p) {
    pfEditingId = p.id;
    pfImages = [0, 1, 2, 3].map((i) => p.images[i] || null);
    pfSelectedColors = [...(p.colors || [])];
    el("product-form-title").textContent = t("상품 수정") + " — " + p.id;
    el("pf-id").value = p.id;
    el("pf-id").disabled = true;
    el("pf-name").value = p.name || "";
    el("pf-nameko").value = p.nameKo || "";
    el("pf-type").value = p.type || "hoodie";
    renderPfCategory(p.category || "");
    el("pf-price").value = p.price;
    el("pf-badge").value = p.badge || "";
    el("pf-short").value = p.short || "";
    el("pf-desc").value = p.desc || "";
    el("pf-details").value = (p.details || []).join("\n");
    const soldOut = p.soldOut || [];
    document.querySelectorAll(".pf-size").forEach((cb) => (cb.checked = !soldOut.includes(cb.value)));
    el("pf-sizetable").value = p.sizeTable || "hoodie";
    el("pf-charmready").checked = !!p.charmReady;
    el("pf-active").checked = p.active !== false;
    el("pf-cancel").hidden = false;
    renderPfColors();
    renderPfPhotos();
    el("product-form").scrollIntoView({ behavior: "smooth", block: "start" });
  }

  el("product-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const id = el("pf-id").value.trim();
    if (!pfEditingId && !/^[a-z0-9-]{2,60}$/.test(id)) {
      toast(t("상품 ID는 영문 소문자·숫자·하이픈만 2~60자로 입력해 주세요."));
      return;
    }
    const category = el("pf-category").value === "__custom__" ? el("pf-category-custom").value.trim() : el("pf-category").value;
    if (!category) {
      toast(t("카테고리를 입력해 주세요."));
      return;
    }

    const body = {
      name: el("pf-name").value.trim(),
      nameKo: el("pf-nameko").value.trim(),
      type: el("pf-type").value,
      category,
      price: Number(el("pf-price").value),
      badge: el("pf-badge").value.trim(),
      short: el("pf-short").value.trim(),
      desc: el("pf-desc").value.trim(),
      details: el("pf-details").value.split("\n").map((s) => s.trim()).filter(Boolean),
      colors: pfSelectedColors,
      sizes: PF_SIZE_OPTIONS,
      soldOut: [...document.querySelectorAll(".pf-size")].filter((cb) => !cb.checked).map((cb) => cb.value),
      sizeTable: el("pf-sizetable").value,
      charmReady: el("pf-charmready").checked,
      active: el("pf-active").checked,
      images: pfImages,
    };

    const btn = el("pf-submit");
    btn.disabled = true;
    try {
      const result = pfEditingId
        ? await adminFetch(`/api/admin/products/${encodeURIComponent(pfEditingId)}`, { method: "PATCH", body: JSON.stringify(body) })
        : await adminFetch("/api/admin/products", { method: "POST", body: JSON.stringify({ id, ...body }) });

      if (!result) return;
      toast(t("상품을 저장했습니다"));
      resetProductForm();
      paintAdminProducts();
    } finally {
      btn.disabled = false;
    }
  });

  el("pf-cancel").addEventListener("click", () => resetProductForm());
  resetProductForm();

  const productsState = { page: 0, pageSize: 50, total: 0, items: [] };

  function productRowHTML(p) {
    const img = p.images.find(Boolean);
    return `
      <div class="grid-card" data-id="${esc(p.id)}">
        <div class="grid-card-thumb">
          ${img ? `<img src="${esc(img)}" alt="">` : ""}
          ${p.active ? "" : `<span class="grid-card-badge">${esc(t("비공개"))}</span>`}
        </div>
        <div class="grid-card-body">
          <b>${esc(t(p.nameKo))}</b>
          <div class="small tnum">${money(p.price)}</div>
        </div>
        <div class="grid-card-actions">
          <button type="button" class="btn btn--sm admin-product-edit">${esc(t("수정"))}</button>
          <button type="button" class="btn btn--sm btn--danger admin-product-delete">${esc(t("삭제"))}</button>
        </div>
      </div>`;
  }

  function renderAdminProducts() {
    productsState.items.forEach((p) => {
      if (p.category && !pfKnownCategories.includes(p.category)) pfKnownCategories.push(p.category);
    });
    const hasMore = productsState.items.length < productsState.total;
    el("products-list").innerHTML = productsState.items.map(productRowHTML).join("") + loadMoreHTML(hasMore, "products-list-more");

    el("products-list").querySelectorAll(".admin-product-edit").forEach((btn) =>
      btn.addEventListener("click", () => {
        const id = btn.closest("[data-id]").dataset.id;
        const p = productsState.items.find((x) => x.id === id);
        if (p) fillProductForm(p);
      })
    );
    el("products-list").querySelectorAll(".admin-product-delete").forEach((btn) =>
      btn.addEventListener("click", async () => {
        const id = btn.closest("[data-id]").dataset.id;
        if (!confirm(t("정말 삭제하시겠습니까? 되돌릴 수 없습니다.") + "\n" + id)) return;
        await adminFetch(`/api/admin/products/${encodeURIComponent(id)}`, { method: "DELETE" });
        if (pfEditingId === id) resetProductForm();
        toast(t("상품을 삭제했습니다"));
        paintAdminProducts();
      })
    );

    el("products-list-more")?.addEventListener("click", () => paintAdminProducts(true));
  }

  async function paintAdminProducts(loadMore = false) {
    productsState.page = loadMore ? productsState.page + 1 : 1;
    const result = await adminFetch(`/api/admin/products?page=${productsState.page}&pageSize=${productsState.pageSize}`);
    if (!result) return;
    productsState.total = result.total;
    productsState.items = loadMore ? productsState.items.concat(result.items) : result.items;
    renderAdminProducts();
  }

  /* ---------- 룩북 관리 ---------- */
  let lfEditingId = null;
  let lfSrc = null;
  const lookbookState = { page: 0, pageSize: 50, total: 0, items: [] };
  const LF_RATIO_PRESETS = ["1/1", "4/5", "3/4", "2/3", "16/10", "16/9"];

  function renderLfRatio(value) {
    const v = value || "16/10";
    if (LF_RATIO_PRESETS.includes(v)) {
      el("lf-ratio-select").value = v;
      el("lf-ratio").hidden = true;
      el("lf-ratio").value = "";
    } else {
      el("lf-ratio-select").value = "__custom__";
      el("lf-ratio").hidden = false;
      el("lf-ratio").value = v;
    }
  }
  function getLfRatio() {
    return el("lf-ratio-select").value === "__custom__" ? el("lf-ratio").value.trim() : el("lf-ratio-select").value;
  }
  el("lf-ratio-select").addEventListener("change", () => {
    const isCustom = el("lf-ratio-select").value === "__custom__";
    el("lf-ratio").hidden = !isCustom;
    if (isCustom) el("lf-ratio").focus();
    renderLfPreview();
  });
  el("lf-ratio").addEventListener("input", renderLfPreview);

  function renderLfPreview() {
    const ratio = getLfRatio() || "16/10";
    el("lf-preview-figure").className = el("lf-span").value;
    el("lf-preview-media").outerHTML = lfSrc
      ? `<div class="shot" id="lf-preview-media" style="aspect-ratio:${esc(ratio)}"><img src="${esc(lfSrc)}" alt=""></div>`
      : `<div class="ph" id="lf-preview-media" style="aspect-ratio:${esc(ratio)}"><span class="ph__label">${esc(ratio.replace("/", " : "))} · ${t("사진 준비중")}</span></div>`;
    el("lf-preview-label").textContent = el("lf-label").value.trim() || t("라벨");
    el("lf-preview-note").textContent = el("lf-note").value.trim();
  }
  ["lf-label", "lf-note", "lf-span"].forEach((id) => el(id).addEventListener("input", renderLfPreview));

  function renderLfPhoto() {
    el("lf-photo").innerHTML = `
      ${lfSrc
        ? `<img src="${esc(lfSrc)}" style="width:100%;aspect-ratio:4/5;object-fit:cover;border-radius:8px;border:1px solid var(--line)">`
        : `<div style="width:100%;aspect-ratio:4/5;border:1px dashed var(--line);border-radius:8px;display:flex;align-items:center;justify-content:center" class="small">${esc(t("사진 없음"))}</div>`}
      <div style="display:flex;flex-direction:column;gap:6px;margin-top:8px">
        <label class="upload-btn" style="cursor:pointer;justify-content:center;width:100%">
          ${PF_UPLOAD_ICON}
          <span>${esc(lfSrc ? t("사진 변경") : t("사진 선택"))}</span>
          <input type="file" accept="image/*" class="upload-input" id="lf-photo-input">
        </label>
        ${lfSrc ? `<button type="button" class="btn btn--sm btn--ghost" id="lf-photo-remove">${esc(t("제거"))}</button>` : ""}
      </div>
    `;
    el("lf-photo-input").addEventListener("change", onLfPhotoChange);
    el("lf-photo-remove")?.addEventListener("click", () => { lfSrc = null; renderLfPhoto(); renderLfPreview(); });
    renderLfPreview();
  }

  async function onLfPhotoChange(e) {
    const file = e.target.files[0];
    if (!file) return;
    const token = await getAccessToken();
    const fd = new FormData();
    fd.append("photo", file);
    e.target.disabled = true;
    try {
      const res = await fetch("/api/admin/lookbook/photo", {
        method: "POST",
        headers: { Authorization: "Bearer " + token },
        body: fd,
      });
      if (!res.ok) throw new Error("failed");
      const { url } = await res.json();
      lfSrc = url;
      renderLfPhoto();
    } catch (err) {
      toast(t("사진 업로드에 실패했습니다"));
    }
  }

  function resetLookbookForm() {
    lfEditingId = null;
    lfSrc = null;
    el("lookbook-form-title").textContent = t("새 룩북 칸 추가");
    el("lf-label").value = "";
    el("lf-note").value = "";
    el("lf-span").value = "w6";
    renderLfRatio("16/10");
    el("lf-active").checked = true;
    el("lf-cancel").hidden = true;
    el("lf-delete").hidden = true;
    renderLfPhoto();
    renderLookbookVisual();
  }

  function fillLookbookForm(item) {
    lfEditingId = item.id;
    lfSrc = item.src || null;
    el("lookbook-form-title").textContent = t("룩북 칸 수정");
    el("lf-label").value = item.label || "";
    el("lf-note").value = item.note || "";
    el("lf-span").value = item.span || "w6";
    renderLfRatio(item.ratio || "16/10");
    el("lf-active").checked = item.active !== false;
    el("lf-cancel").hidden = false;
    el("lf-delete").hidden = false;
    renderLfPhoto();
    renderLookbookVisual();
    el("lookbook-form").scrollIntoView({ behavior: "smooth", block: "start" });
  }

  el("lookbook-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const body = {
      label: el("lf-label").value.trim(),
      note: el("lf-note").value.trim(),
      span: el("lf-span").value,
      ratio: getLfRatio(),
      active: el("lf-active").checked,
      src: lfSrc,
    };

    const btn = el("lf-submit");
    btn.disabled = true;
    try {
      const result = lfEditingId
        ? await adminFetch(`/api/admin/lookbook/${encodeURIComponent(lfEditingId)}`, { method: "PATCH", body: JSON.stringify(body) })
        : await adminFetch("/api/admin/lookbook", { method: "POST", body: JSON.stringify(body) });

      if (!result) return;
      toast(t("저장했습니다"));
      resetLookbookForm();
      paintAdminLookbook();
    } finally {
      btn.disabled = false;
    }
  });

  el("lf-cancel").addEventListener("click", () => resetLookbookForm());
  el("lf-delete").addEventListener("click", async () => {
    if (!lfEditingId) return;
    if (!confirm(t("이 룩북 칸을 삭제하시겠습니까? 되돌릴 수 없습니다."))) return;
    await adminFetch(`/api/admin/lookbook/${encodeURIComponent(lfEditingId)}`, { method: "DELETE" });
    toast(t("삭제했습니다"));
    resetLookbookForm();
    paintAdminLookbook();
  });
  resetLookbookForm();

  /* 실제 lookbook.html의 12칸 그리드(.look figure.w4/w6/w8/w12)와 동일한 배치를 그대로 재현해서,
     "몇 번째 칸을 고칠지"를 글로 고르지 않고 화면에서 직접 클릭해 고르게 한다. */
  function renderLookbookVisual() {
    const tiles = lookbookState.items
      .map(
        (item) => `
      <button type="button" class="look-tile ${esc(item.span)} ${item.id === lfEditingId ? "is-editing" : ""}" data-id="${esc(item.id)}">
        ${item.src ? `<img src="${esc(item.src)}" alt="">` : `<span class="look-tile-empty">${esc(item.ratio)}</span>`}
        <span class="look-tile-label">${esc(item.label)}</span>
        ${item.active === false ? `<span class="look-tile-hidden">${esc(t("비공개"))}</span>` : ""}
      </button>`
      )
      .join("");

    el("lookbook-visual").innerHTML =
      tiles + `<button type="button" class="look-tile look-tile-add w4" id="lf-add-tile">+ ${esc(t("새 칸 추가"))}</button>`;

    el("lookbook-visual").querySelectorAll(".look-tile:not(.look-tile-add)").forEach((btn) =>
      btn.addEventListener("click", () => {
        const item = lookbookState.items.find((x) => x.id === btn.dataset.id);
        if (item) fillLookbookForm(item);
      })
    );
    el("lf-add-tile").addEventListener("click", () => {
      resetLookbookForm();
      el("lookbook-form").scrollIntoView({ behavior: "smooth", block: "start" });
    });
  }

  async function paintAdminLookbook(loadMore = false) {
    lookbookState.page = loadMore ? lookbookState.page + 1 : 1;
    const result = await adminFetch(`/api/admin/lookbook?page=${lookbookState.page}&pageSize=${lookbookState.pageSize}`);
    if (!result) return;
    lookbookState.total = result.total;
    lookbookState.items = loadMore ? lookbookState.items.concat(result.items) : result.items;
    renderLookbookVisual();
  }

  /* ---------- 정보(설정) — 사업자 정보 요약, Supabase·Render 같은 운영 링크를 관리자가 직접 적어두는 곳 ---------- */
  let sfEditingId = null;
  const settingsState = { items: [] };

  function resetSettingsForm() {
    sfEditingId = null;
    el("settings-form-title").textContent = t("새 정보 추가");
    el("sf-label").value = "";
    el("sf-value").value = "";
    el("sf-note").value = "";
    el("sf-cancel").hidden = true;
    el("sf-delete").hidden = true;
  }

  function fillSettingsForm(item) {
    sfEditingId = item.id;
    el("settings-form-title").textContent = t("정보 수정");
    el("sf-label").value = item.label || "";
    el("sf-value").value = item.value || "";
    el("sf-note").value = item.note || "";
    el("sf-cancel").hidden = false;
    el("sf-delete").hidden = false;
    el("settings-form").scrollIntoView({ behavior: "smooth", block: "start" });
  }

  el("settings-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const body = {
      label: el("sf-label").value.trim(),
      value: el("sf-value").value.trim(),
      note: el("sf-note").value.trim(),
    };
    if (!body.label) { toast(t("이름을 입력해 주세요.")); return; }

    const btn = el("sf-submit");
    btn.disabled = true;
    try {
      const result = sfEditingId
        ? await adminFetch(`/api/admin/settings/${encodeURIComponent(sfEditingId)}`, { method: "PATCH", body: JSON.stringify(body) })
        : await adminFetch("/api/admin/settings", { method: "POST", body: JSON.stringify(body) });
      if (!result) return;
      toast(t("저장했습니다"));
      resetSettingsForm();
      paintAdminSettings();
    } finally {
      btn.disabled = false;
    }
  });

  el("sf-cancel").addEventListener("click", () => resetSettingsForm());
  el("sf-delete").addEventListener("click", async () => {
    if (!sfEditingId) return;
    if (!confirm(t("이 정보를 삭제하시겠습니까?"))) return;
    await adminFetch(`/api/admin/settings/${encodeURIComponent(sfEditingId)}`, { method: "DELETE" });
    toast(t("삭제했습니다"));
    resetSettingsForm();
    paintAdminSettings();
  });
  resetSettingsForm();

  function isUrl(v) {
    return /^https?:\/\//i.test(v);
  }

  function settingRowHTML(item) {
    return `
      <div class="panel" data-id="${esc(item.id)}" style="display:flex;gap:12px;align-items:center">
        <div style="flex:1;min-width:0">
          <b>${esc(item.label)}</b>
          ${item.value ? `<div class="small tnum" style="word-break:break-all">${isUrl(item.value) ? `<a href="${esc(item.value)}" target="_blank" rel="noopener">${esc(item.value)}</a>` : esc(item.value)}</div>` : ""}
          ${item.note ? `<div class="small" style="color:var(--muted);margin-top:2px">${esc(item.note)}</div>` : ""}
        </div>
        <button type="button" class="btn btn--sm admin-setting-edit">${esc(t("수정"))}</button>
      </div>`;
  }

  function renderAdminSettings() {
    el("settings-list").innerHTML = settingsState.items.map(settingRowHTML).join("");
    el("settings-list").querySelectorAll(".admin-setting-edit").forEach((btn) =>
      btn.addEventListener("click", () => {
        const id = btn.closest("[data-id]").dataset.id;
        const item = settingsState.items.find((x) => x.id === id);
        if (item) fillSettingsForm(item);
      })
    );
  }

  async function paintAdminSettings() {
    const result = await adminFetch("/api/admin/settings");
    if (!result) return;
    settingsState.items = result;
    renderAdminSettings();
  }

  /* ---------- 감사 로그 (관리자가 2명 이상일 때 "누가 언제 무엇을 바꿨는지" 추적용) ----------
     008_admin_audit_log.sql을 실행하지 않았으면 서버가 저장을 조용히 건너뛰므로 여기도 빈 목록만 보임. */
  const AUDIT_ACTION_LABELS = {
    "order.update": "주문 정보 변경",
    "return.update": "반품 상태 변경",
    "inventory.update": "재고 수정",
    "product.create": "상품 등록",
    "product.update": "상품 수정",
    "product.delete": "상품 삭제",
    "lookbook.create": "룩북 칸 추가",
    "lookbook.update": "룩북 칸 수정",
    "lookbook.delete": "룩북 칸 삭제",
    "setting.create": "정보 추가",
    "setting.update": "정보 수정",
    "setting.delete": "정보 삭제",
    "review.update": "리뷰 승인/숨김",
    "review.delete": "리뷰 삭제",
    "qna.answer": "문의 답변 등록",
  };
  function fmtDateTime(iso) {
    return new Date(iso).toLocaleString(getLang() === "de" ? "de-DE" : "ko-KR");
  }

  const auditLogState = { page: 0, pageSize: 30, total: 0, items: [] };

  function auditRowHTML(r) {
    const label = t(AUDIT_ACTION_LABELS[r.action] || r.action);
    const detailStr = r.detail && Object.keys(r.detail).length ? JSON.stringify(r.detail) : "";
    return `
      <div class="logrow">
        <span class="tnum small">${esc(fmtDateTime(r.at))}</span>
        <span class="small">${esc(r.adminEmail)}</span>
        <span class="logrow-action">${esc(label)}</span>
        <span>
          <span class="tnum">${esc(r.targetType)}:${esc(r.targetId)}</span>
          ${detailStr ? `<div class="logrow-detail">${esc(detailStr)}</div>` : ""}
        </span>
      </div>`;
  }

  function renderAuditLog() {
    el("auditlog-rows").innerHTML =
      auditLogState.items.map(auditRowHTML).join("") ||
      `<div class="logrow small" style="color:var(--text-muted)">${esc(t("아직 기록된 활동이 없습니다"))}</div>`;
    const hasMore = auditLogState.items.length < auditLogState.total;
    el("auditlog-more-wrap").innerHTML = loadMoreHTML(hasMore, "auditlog-more");
    el("auditlog-more")?.addEventListener("click", () => paintAdminAuditLog(true));
  }

  async function paintAdminAuditLog(loadMore = false) {
    auditLogState.page = loadMore ? auditLogState.page + 1 : 1;
    const result = await adminFetch(`/api/admin/audit-log?page=${auditLogState.page}&pageSize=${auditLogState.pageSize}`);
    if (!result) return;
    auditLogState.total = result.total;
    auditLogState.items = loadMore ? auditLogState.items.concat(result.items) : result.items;
    renderAuditLog();
  }

  /* ---------- 대시보드 (매출/베스트셀러 요약) ---------- */
  function dayLabel(dateStr) {
    const d = new Date(dateStr + "T00:00:00");
    return `${d.getMonth() + 1}/${d.getDate()}`;
  }

  function renderDashboard(d) {
    el("dashboard-stats").innerHTML = `
      <div class="stat-tile">
        <div class="stat-tile-label">${esc(t("오늘 매출"))}</div>
        <div class="stat-tile-value tnum">${money(d.todayRevenue)}</div>
      </div>
      <div class="stat-tile">
        <div class="stat-tile-label">${esc(t("이번 달 매출"))}</div>
        <div class="stat-tile-value tnum">${money(d.monthRevenue)}</div>
      </div>
      <div class="stat-tile">
        <div class="stat-tile-label">${esc(t("누적 주문"))}</div>
        <div class="stat-tile-value tnum">${d.totalOrders.toLocaleString("ko-KR")}</div>
        <div class="stat-tile-sub">${esc(t("건"))}</div>
      </div>
      <div class="stat-tile">
        <div class="stat-tile-label">${esc(t("입금 대기"))}</div>
        <div class="stat-tile-value tnum">${d.pendingCount.toLocaleString("ko-KR")}</div>
        <div class="stat-tile-sub">${esc(t("건 — 확인 필요"))}</div>
      </div>`;

    const max = Math.max(1, ...d.dailyRevenue.map((r) => r.total));
    el("dashboard-revenue-chart").innerHTML = d.dailyRevenue
      .map(
        (r) => `
        <div class="chart-bar-col" title="${esc(dayLabel(r.date))} · ${esc(money(r.total))}">
          <div class="chart-bar" style="height:${Math.max(2, Math.round((r.total / max) * 100))}%"></div>
          <span class="chart-bar-label">${esc(dayLabel(r.date))}</span>
        </div>`
      )
      .join("");

    const bestMax = Math.max(1, ...d.bestsellers.map((b) => b.qty));
    el("dashboard-bestsellers").innerHTML = d.bestsellers.length
      ? d.bestsellers
          .map(
            (b, i) => `
          <div class="best-row">
            <span class="best-rank">${i + 1}</span>
            <span>${esc(t(b.name))}</span>
            <span class="tnum">${esc(t("{n}개", { n: b.qty }))}</span>
            <div class="best-bar-track"><div class="best-bar-fill" style="width:${Math.round((b.qty / bestMax) * 100)}%"></div></div>
          </div>`
          )
          .join("")
      : `<p class="small" style="color:var(--text-muted)">${esc(t("아직 주문이 없습니다"))}</p>`;
  }

  async function paintAdminDashboard() {
    const result = await adminFetch("/api/admin/dashboard");
    if (!result) return;
    renderDashboard(result);
  }

  /* /api/admin/orders 호출이 실제로 성공했을 때(=서버가 관리자로 인정했을 때)만 패널을 연다 —
     profile.role만 믿지 않는다(계정 페이지 관리자 판단 로직과 동일한 원칙). */
  async function tryShowAdminPanel(profile) {
    const orders = await adminFetch("/api/admin/orders");
    if (!orders) return false;
    el("admin-panel").hidden = false;
    el("sidebar").hidden = false;
    el("admin-chip").hidden = false;
    el("logout").hidden = false;
    const name = profile.name || profile.email;
    el("admin-name").textContent = name;
    el("admin-avatar").textContent = name.slice(0, 1).toUpperCase();
    paintAdminOrders();
    paintAdminReturns();
    paintAdminInventory();
    paintAdminQna();
    paintAdminProducts();
    paintAdminReviews();
    paintAdminLookbook();
    paintAdminSettings();
    paintAdminAuditLog();
    paintAdminDashboard();
    return true;
  }

  /* ---------- 부팅 ---------- */
  (async () => {
    const client = await getSupabaseClient();
    if (!client) {
      el("no-server-notice").hidden = false;
      return;
    }

    const isRecovery = /type=recovery/.test(location.hash);
    const profile = isRecovery ? null : await getCurrentProfile();

    const savedEmail = localStorage.getItem("works_saved_email");
    if (savedEmail) {
      el("li-email").value = savedEmail;
      el("li-remember").checked = true;
    }

    if (isRecovery) {
      el("auth-view").hidden = false;
      el("login-form").hidden = true;
      el("reset-confirm-form").hidden = false;
    } else if (!profile) {
      el("auth-view").hidden = false;
    } else {
      const ok = await tryShowAdminPanel(profile);
      if (!ok) {
        await client.auth.signOut();
        el("auth-view").hidden = false;
        el("li-err").textContent = t("관리자 계정으로만 접속할 수 있습니다.");
        el("li-err").classList.add("on");
      }
    }

    el("login-form")?.addEventListener("submit", async (e) => {
      e.preventDefault();
      const btn = el("li-submit");
      btn.disabled = true;
      const { error } = await client.auth.signInWithPassword({
        email: el("li-email").value.trim(),
        password: el("li-pw").value,
      });
      if (error) {
        el("li-err").textContent = t("이메일 또는 비밀번호가 올바르지 않습니다.");
        el("li-err").classList.add("on");
        btn.disabled = false;
        return;
      }
      if (el("li-remember").checked) localStorage.setItem("works_saved_email", el("li-email").value.trim());
      else localStorage.removeItem("works_saved_email");
      location.reload();
    });

    el("forgot-pw-link")?.addEventListener("click", (e) => {
      e.preventDefault();
      el("login-form").hidden = true;
      el("reset-request-form").hidden = false;
    });

    el("rq-cancel")?.addEventListener("click", () => {
      el("reset-request-form").hidden = true;
      el("login-form").hidden = false;
    });

    el("reset-request-form")?.addEventListener("submit", async (e) => {
      e.preventDefault();
      const btn = el("rq-submit");
      btn.disabled = true;
      const { error } = await client.auth.resetPasswordForEmail(el("rq-email").value.trim(), {
        redirectTo: location.origin + "/",
      });
      btn.disabled = false;
      if (error) {
        el("rq-err").textContent = authErrorMessage(error);
        el("rq-err").classList.add("on");
        return;
      }
      toast(t("재설정 링크를 이메일로 보내드렸습니다."));
      el("reset-request-form").hidden = true;
      el("login-form").hidden = false;
    });

    el("reset-confirm-form")?.addEventListener("submit", async (e) => {
      e.preventDefault();
      const pw1 = el("rc-pw").value;
      const pw2 = el("rc-pw2").value;
      if (pw1.length < 6) {
        el("rc-err").textContent = t("비밀번호는 6자 이상이어야 합니다.");
        el("rc-err").classList.add("on");
        return;
      }
      if (pw1 !== pw2) {
        el("rc-err").textContent = t("비밀번호가 일치하지 않습니다.");
        el("rc-err").classList.add("on");
        return;
      }
      const btn = el("rc-submit");
      btn.disabled = true;
      const { error } = await client.auth.updateUser({ password: pw1 });
      btn.disabled = false;
      if (error) {
        el("rc-err").textContent = authErrorMessage(error);
        el("rc-err").classList.add("on");
        return;
      }
      toast(t("비밀번호가 변경되었습니다. 다시 로그인해 주세요."));
      await client.auth.signOut();
      location.href = "/";
    });

    el("logout")?.addEventListener("click", async () => {
      await client.auth.signOut();
      location.reload();
    });
  })();
</script>
</body>
</html>
