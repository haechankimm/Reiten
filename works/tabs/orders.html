              <div class="field" style="margin:0">

              <div style="display:flex;gap:8px;flex-wrap:wrap;position:relative">

                <button type="button" class="btn btn--sm btn--ghost" id="ord-export" data-i18n="내보내기">내보내기</button>

                </div>
                <button type="button" class="btn btn--sm btn--ghost" id="ord-bulk-toggle" data-i18n="일괄 처리">일괄 처리</button>
              </div>
            </div>

              <textarea id="ord-bulk-input" rows="6" style="width:100%;margin-top:8px;font-family:monospace" placeholder="R260801-000001,입금확인&#10;R260801-000002,,cj,123456789012" data-i18n-attr="placeholder:R260801-000001,입금확인&#10;R260801-000002,,cj,123456789012"></textarea>
              <div style="margin-top:8px;display:flex;gap:8px;align-items:center">

                <span class="small" id="ord-bulk-result" style="color:var(--text-muted)"></span>
              </div>
            </div>
          </div>
          <div class="split">
            <div class="plist" id="orders-plist"></div>
            <div class="detail" id="orders-detail"></div>
          </div>
        </div>
