<!doctype html>
<html lang="ko" data-theme="light">
<head>
<meta charset="utf-8">
<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-0GKE5QTQ31"></script>
<script src="assets/js/site-init.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>주문 조회 — REITEN</title>
<meta name="robots" content="noindex">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="assets/img/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<main id="main">
  <section class="sec sec--tight">
    <div class="wrap">
      <p class="eyebrow">Order Lookup</p>
      <h1 class="h-xl" style="margin-top:12px" data-i18n="주문 조회">주문 조회</h1>
      <p class="lede" style="margin-top:14px;max-width:56ch" data-i18n="회원가입 없이도 주문번호와 연락처만으로 주문 상태를 확인할 수 있습니다.">
        회원가입 없이도 주문번호와 연락처만으로 주문 상태를 확인할 수 있습니다.
      </p>
      <hr class="rule" style="margin:26px 0 34px">

      <form id="lookup-form" novalidate style="max-width:56ch">
        <div class="field">
          <label for="lk-no" data-i18n-html data-i18n='주문번호 <span class="req">*</span>'>주문번호 <span class="req">*</span></label>
          <input id="lk-no" placeholder="R260801-000001" required>
          <p class="err" data-i18n="주문번호를 입력해 주세요.">주문번호를 입력해 주세요.</p>
        </div>
        <div class="field">
          <label for="lk-tel" data-i18n-html data-i18n='주문 시 연락처 <span class="req">*</span>'>주문 시 연락처 <span class="req">*</span></label>
          <input id="lk-tel" inputmode="tel" autocomplete="tel" placeholder="010-0000-0000" required>
          <p class="err" data-i18n="연락처를 입력해 주세요.">연락처를 입력해 주세요.</p>
        </div>
        <button class="btn btn--full" type="submit" id="lk-submit" data-i18n="조회하기">조회하기</button>
      </form>

      <div id="lk-notfound" class="notice" hidden style="margin-top:24px;max-width:56ch">
        <span data-i18n="일치하는 주문을 찾을 수 없습니다. 주문번호와 연락처를 다시 확인해 주세요.">일치하는 주문을 찾을 수 없습니다. 주문번호와 연락처를 다시 확인해 주세요.</span>
      </div>

      <div id="lk-result" hidden style="margin-top:44px">
        <h2 class="h-md" id="lk-title"></h2>
        <p class="small tnum" id="lk-status" style="margin-top:8px"></p>

        <div id="lk-tracking" class="notice" hidden style="margin-top:18px"></div>

        <table class="spec" style="margin-top:24px">
          <thead><tr><th data-i18n="상품">상품</th><th data-i18n="옵션">옵션</th><th data-i18n="수량">수량</th><th data-i18n="금액">금액</th></tr></thead>
          <tbody id="lk-items"></tbody>
        </table>
        <div id="lk-extra"></div>

        <div id="lk-cancel-block" hidden style="margin-top:28px">
          <button class="btn btn--ghost" type="button" id="lk-cancel-open" data-i18n="주문취소 신청">주문취소 신청</button>
          <form id="lk-cancel-form" hidden novalidate style="max-width:56ch;margin-top:16px">
            <div class="field">
              <label for="ck-name" data-i18n-html data-i18n='이름 <span class="req">*</span>'>이름 <span class="req">*</span></label>
              <input id="ck-name" autocomplete="name" required>
              <p class="err" data-i18n="이름을 입력해 주세요.">이름을 입력해 주세요.</p>
            </div>
            <div class="field">
              <label for="ck-reason" data-i18n-html data-i18n='취소 사유 <span class="req">*</span>'>취소 사유 <span class="req">*</span></label>
              <select id="ck-reason" required>
                <option value="단순변심" data-i18n="단순변심">단순변심</option>
                <option value="배송 지연" data-i18n="배송 지연">배송 지연</option>
                <option value="주문 실수(옵션·수량 등)" data-i18n="주문 실수(옵션·수량 등)">주문 실수(옵션·수량 등)</option>
                <option value="다른 상품 구매 예정" data-i18n="다른 상품 구매 예정">다른 상품 구매 예정</option>
                <option value="기타" data-i18n="기타">기타</option>
              </select>
            </div>
            <div class="field" id="ck-custom-field" hidden>
              <label for="ck-custom" data-i18n-html data-i18n='사유 직접 입력 <span class="req">*</span>'>사유 직접 입력 <span class="req">*</span></label>
              <input id="ck-custom" maxlength="300" data-i18n-attr="placeholder:취소 사유를 입력해 주세요" placeholder="취소 사유를 입력해 주세요">
              <p class="err" data-i18n="사유를 입력해 주세요.">사유를 입력해 주세요.</p>
            </div>
            <button class="btn btn--full" type="submit" id="lk-cancel-submit" data-i18n="취소 신청하기">취소 신청하기</button>
          </form>
          <div id="lk-cancel-done" class="notice" hidden style="margin-top:16px">
            <b data-i18n="취소 신청이 접수되었습니다.">취소 신청이 접수되었습니다.</b>
            <p class="small" style="margin-top:6px" data-i18n="담당자가 확인 후 입력하신 연락처로 안내드립니다.">담당자가 확인 후 입력하신 연락처로 안내드립니다.</p>
          </div>
        </div>
      </div>
    </div>
  </section>
</main>

<script src="assets/js/data.js"></script>
<script src="assets/js/i18n.js"></script>
<script src="assets/js/app.js"></script>
<script src="assets/js/pages/order-lookup.js"></script>
</body>
</html>
