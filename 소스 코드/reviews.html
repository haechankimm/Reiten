<!doctype html>
<html lang="ko" data-theme="light">
<head>
<meta charset="utf-8">
<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-0GKE5QTQ31"></script>
<script src="assets/js/site-init.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reviews — REITEN</title>
<meta name="description" content="REITEN을 입어본 분들의 상품 후기.">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="assets/img/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<main id="main">
  <section class="sec sec--tight">
    <div class="wrap">
      <p class="eyebrow" data-reveal>Reviews</p>
      <h1 class="h-xl" style="margin-top:12px" data-reveal="60" data-i18n="상품 리뷰">상품 리뷰</h1>
      <p class="lede" style="margin-top:14px;max-width:56ch" data-reveal="100" data-i18n="REITEN을 입어본 분들의 솔직한 후기입니다.">
        REITEN을 입어본 분들의 솔직한 후기입니다.
      </p>

      <div class="chips" style="margin-top:30px" id="filters" data-reveal="140"></div>
      <div class="chips" style="margin-top:14px" id="sorts" data-reveal="160"></div>
      <hr class="rule" style="margin:26px 0 34px">

      <div id="list" style="display:grid;gap:16px;max-width:70ch"></div>
      <div id="empty" class="empty" hidden>
        <p class="lede" data-i18n="아직 등록된 리뷰가 없습니다.">아직 등록된 리뷰가 없습니다.</p>
      </div>

      <h2 class="h-md" style="margin-top:56px" data-i18n="리뷰 남기기">리뷰 남기기</h2>
      <div id="form-wrap" style="margin-top:18px;max-width:56ch">
        <form id="review-form" novalidate>
          <div class="field">
            <label for="r-product" data-i18n="상품">상품</label>
            <select id="r-product" name="product" required></select>
          </div>
          <div class="field">
            <label for="r-order-no" data-i18n-html data-i18n='주문번호 <span class="req">*</span>'>주문번호 <span class="req">*</span></label>
            <input id="r-order-no" name="orderNo" placeholder="R260801-000001" required>
            <p class="err" data-i18n="주문번호를 입력해 주세요.">주문번호를 입력해 주세요.</p>
          </div>
          <div class="field">
            <label for="r-tel" data-i18n-html data-i18n='주문 시 연락처 <span class="req">*</span>'>주문 시 연락처 <span class="req">*</span></label>
            <input id="r-tel" name="tel" inputmode="tel" autocomplete="tel" placeholder="010-0000-0000" required>
            <p class="err" data-i18n="연락처를 입력해 주세요.">연락처를 입력해 주세요.</p>
            <p class="small" style="margin-top:4px;color:var(--text-muted)" data-i18n="실제 구매하신 주문인지 확인하는 용도로만 사용하며 리뷰에는 표시되지 않습니다.">실제 구매하신 주문인지 확인하는 용도로만 사용하며 리뷰에는 표시되지 않습니다.</p>
          </div>
          <div class="field">
            <label data-i18n="별점">별점</label>
            <div class="chips" id="r-rating"></div>
          </div>
          <div class="field">
            <label for="r-name" data-i18n-html data-i18n='닉네임 <span class="req">*</span>'>닉네임 <span class="req">*</span></label>
            <input id="r-name" name="name" maxlength="40" required>
            <p class="err" data-i18n="닉네임을 입력해 주세요.">닉네임을 입력해 주세요.</p>
          </div>
          <div class="field">
            <label for="r-comment" data-i18n-html data-i18n='후기 내용 <span class="req">*</span>'>후기 내용 <span class="req">*</span></label>
            <textarea id="r-comment" name="comment" maxlength="1000" required></textarea>
            <p class="err" data-i18n="후기 내용을 입력해 주세요.">후기 내용을 입력해 주세요.</p>
          </div>
          <div class="field">
            <label for="r-photo" data-i18n="착용 사진 (선택)">착용 사진 (선택)</label>
            <div class="upload-row">
              <label for="r-photo" class="upload-btn">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h3l2-2h6l2 2h3a1 1 0 0 1 1 1v11a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V8a1 1 0 0 1 1-1Z"/><circle cx="12" cy="13" r="3.5"/></svg>
                <span data-i18n="사진 선택">사진 선택</span>
              </label>
              <input id="r-photo" name="photo" type="file" accept="image/*" class="upload-input">
              <span class="small upload-filename" id="r-photo-name" data-i18n="선택된 파일 없음">선택된 파일 없음</span>
            </div>
            <img id="r-photo-preview" class="upload-preview" alt="" hidden>
            <p class="small" id="r-photo-reward" style="margin-top:8px;color:var(--muted)" hidden></p>
          </div>
          <div class="field">
            <label for="r-insta" data-i18n="인스타그램 아이디 (선택)">인스타그램 아이디 (선택)</label>
            <input id="r-insta" name="instagram" placeholder="@ 없이 아이디만" data-i18n-attr="placeholder:@ 없이 아이디만">
          </div>
          <button class="btn" type="submit" id="r-submit" data-i18n="리뷰 등록">리뷰 등록</button>
        </form>
        <div class="notice" id="no-server-notice" hidden style="margin-top:8px">
          <span data-i18n="지금은 정적 사이트로만 열람 중이라 리뷰 등록을 받을 수 없습니다. server/를 함께 실행하면 리뷰를 남길 수 있습니다.">
            지금은 정적 사이트로만 열람 중이라 리뷰 등록을 받을 수 없습니다. server/를 함께 실행하면 리뷰를 남길 수 있습니다.
          </span>
        </div>
      </div>
    </div>
  </section>
</main>

<script src="assets/js/data.js"></script>
<script src="assets/js/i18n.js"></script>
<script src="assets/js/app.js"></script>
<script src="assets/js/pages/reviews.js"></script>
</body>
</html>
