<title>위시리스트 — REITEN</title>
<meta name="robots" content="noindex">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="assets/img/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<main id="main">
  <section class="sec sec--tight">
    <div class="wrap">
      <p class="eyebrow">Wishlist</p>
      <h1 class="h-xl" style="margin-top:12px" data-i18n="위시리스트">위시리스트</h1>
      <p class="lede" style="margin-top:14px;max-width:52ch" data-i18n="담아둔 상품은 이 기기의 브라우저에만 저장됩니다.">
        담아둔 상품은 이 기기의 브라우저에만 저장됩니다.
      </p>
      <hr class="rule" style="margin:26px 0 34px">

      <div class="grid" id="grid"></div>
      <div id="empty" class="empty" hidden>
        <p class="lede" data-i18n="아직 담은 상품이 없습니다.">아직 담은 상품이 없습니다.</p>
        <a class="btn" style="margin-top:16px" href="shop.html" data-i18n="상품 보러 가기">상품 보러 가기</a>
      </div>
    </div>
  </section>
</main>

<script src="assets/js/data.js"></script>
<script src="assets/js/i18n.js"></script>
<script src="assets/js/app.js"></script>
<script>
  applyI18n();
  renderHeader("");

  (async () => {
    await Promise.all([loadProducts(), loadColors()]);

    const gridEl = document.getElementById("grid");
    const emptyEl = document.getElementById("empty");

    function paint() {
      const ids = Wishlist.read();
      const list = ids.map((id) => PRODUCTS.find((p) => p.id === id)).filter(Boolean);
      gridEl.innerHTML = list.map((p, i) => productCard(p, i * 50)).join("");
      emptyEl.hidden = list.length > 0;
      bindWishlistButtons(gridEl);
      // 이 페이지에서는 하트를 누르면 목록 자체에서 카드가 빠져야 한다(다른 페이지는 배지만
      // 갱신되면 충분하지만, 여기는 그 상품 자체가 화면의 전부라서) — 클릭 처리(toggle) 다음
      // 틱에 다시 그린다.
      gridEl.querySelectorAll(".js-wishlist-btn").forEach((btn) =>
        btn.addEventListener("click", () => setTimeout(paint, 0))
      );
      initReveal();
      initBeams();
    }

    paint();
  })();

  renderFooter();
</script>
</body>
</html>
